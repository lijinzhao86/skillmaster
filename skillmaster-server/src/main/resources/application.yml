spring:
  application:
    name: skillmaster-server

  # PostgreSQL is the only state store — metadata, permissions, audit and the file bytes
  # themselves (ADR 0010). There is no second datastore to configure.
  datasource:
    url: ${SKILLMASTER_DB_URL:jdbc:postgresql://localhost:5432/skillmaster}
    # Defaults to the OS user, which is what a local Homebrew PostgreSQL expects. Deployment
    # supplies both explicitly.
    username: ${SKILLMASTER_DB_USER:${USER}}
    password: ${SKILLMASTER_DB_PASSWORD:}

  flyway:
    locations: classpath:db/migration
    # Never baseline an existing database automatically: a schema that Flyway did not build
    # is a schema whose history we cannot vouch for.
    baseline-on-migrate: false

  # NOT the skill limit. That one is 512 files / 16 MiB uncompressed and is enforced by M5, which
  # can say which file broke it. This is only a ceiling on how much is buffered before validation
  # runs, and it is deliberately set above the largest payload a legal skill can produce — 16 MiB
  # of content plus zip and multipart overhead — so that an over-limit skill is refused by the
  # validator with a reason, rather than by the container with a bare 413.
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 32MB

  # §4.2's wire format is snake_case. Set once here rather than annotated field by field: a
  # forgotten annotation is a silently misnamed field, and this cannot be forgotten.
  jackson:
    property-naming-strategy: SNAKE_CASE

  # The /web plane's sessions. They live in PostgreSQL like every other piece of state (ADR 0010),
  # in the two spring_session tables that V3__account_login.sql creates — so Boot's own script
  # initializer must stay off, or it either fails on tables that already exist or creates them
  # outside Flyway. It is armed by the dependency alone, which is why this line ships with it.
  #
  # **The timeout is the idle ruler, and it is a reference rather than a number.** This is the value
  # Spring Session actually expires an untouched session by (it lands on max_inactive_interval); the
  # absolute ceiling is the other ruler and is not expressible here at all (ADR 0043 §决定 1). Both
  # are configured once under `skillmaster.sessions` below and read from there, so the framework and
  # our own record cannot come to disagree about the idle window — which they would if this line
  # repeated the number.
  session:
    jdbc:
      initialize-schema: never
    timeout: ${skillmaster.sessions.idle}

server:
  # Honor X-Forwarded-For / X-Forwarded-Proto from the reverse proxy ADR 0015 puts in front of this.
  #
  # Stated rather than left to Boot's platform detection, which is silent and only fires on a cloud
  # provider: on a plain host behind nginx the default is NONE, and then getRemoteAddr() is the
  # proxy's address. Every per-address rule — SMS and login and captcha — would collapse into one
  # bucket shared by the whole user base, so the 31st message of an hour would refuse the 32nd
  # person to register. The cookie flags follow the same header: isSecure() decides whether the
  # session and CSRF cookies carry Secure, and without this it is false behind an HTTPS proxy.
  #
  # The precondition is stronger than "the proxy is the only way in", and it is the proxy's config
  # that has to meet it: this filter reads the LEFT-MOST value of X-Forwarded-For, and nginx's
  # `$proxy_add_x_forwarded_for` — what ADR 0015's snippet originally used — keeps whatever the
  # caller sent and appends the real address to it. So the left-most value would be the caller's,
  # and every per-address rule could be evaded by varying it. The proxy must OVERWRITE:
  #     proxy_set_header X-Forwarded-For $remote_addr;
  # and should not forward the RFC 7239 `Forwarded` header, which this filter prefers when present.
  # With those two lines the address is the caller's and cannot be chosen by them.
  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        # A session id is bearer-equivalent: whoever reads it is logged in as that user, so script
        # must not be able to read it. The XSRF-TOKEN cookie beside it is the one that deliberately
        # is readable — the asymmetry is the design, not an oversight.
        http-only: true
        same-site: lax
        name: SKILLMASTER_SESSION
  tomcat:
    # How much of a refused body Tomcat will keep reading in order to be able to answer it at all.
    # This is not a nicety: with the 2 MB default, a body over the multipart ceiling is refused
    # *while the client is still uploading*, Tomcat gives up on the unread remainder, closes the
    # connection, and the client sees a broken pipe instead of the 413 — which is indistinguishable
    # from a network failure. Set above the ceiling so that a realistic mistake (a 35 MB zip) gets
    # an answer. Past this, the connection is dropped, and that is the right response to a body
    # that large.
    max-swallow-size: 40MB

skillmaster:
  # The base URL clients reach this server at. Absolute URLs we publish are built from it —
  # the resource_metadata parameter in the 401/403 challenges, and the address inside the
  # gateway skill. It cannot be inferred from a request, because behind a proxy the request's
  # own host is not the client's.
  public-base-url: ${SKILLMASTER_PUBLIC_BASE_URL:http://localhost:8080}

  # No `auth` block: P0's single static token is gone. /api/v1/* is authenticated by tokens the
  # authorization server issues, validated against `access_token` — see modules/token. Nothing in
  # this file can mint one, which is the point: a credential that lives in a config file is a
  # credential that ships with the deployment.
  account:
    # The two keys M1 keeps phone numbers under. NEITHER HAS A DEFAULT, and neither may: a default
    # key is a key anybody reading this repository knows, and phone_hash is indexed and UNIQUE — a
    # known key turns that column back into a list of phone numbers, which is the one thing the
    # blind index exists to prevent. Startup fails without them, which is the intended failure.
    #
    # Both must be at least 32 bytes; the encryption key must be exactly 32 (AES-256). Generate
    # with `openssl rand -hex 16`.
    phone-hmac-key: ${SKILLMASTER_PHONE_HMAC_KEY:}
    phone-enc-key: ${SKILLMASTER_PHONE_ENC_KEY:}
    # The BCrypt cost. Configuration rather than a constant because the test suite hashes hundreds
    # of passwords and cannot pay the production price for each one.
    bcrypt-strength: ${SKILLMASTER_BCRYPT_STRENGTH:10}

  # How long a browser session lives, on its two rulers (ADR 0043). Both defaults are the design's
  # values, so a deployment that says nothing gets the design.
  #
  # `idle` is also the framework's timeout — `spring.session.timeout` above reads *this* property
  # rather than repeating the number, so there is one authority for it. `absolute` is ours alone:
  # nothing in Spring Session expresses a ceiling that being used cannot move, so it is enforced per
  # request by SessionAbsoluteLimitFilter (see modules/account).
  #
  # Durations are ISO-8601, and both `24h` and `PT24H` bind. They must be positive, and the ceiling
  # must not be shorter than the idle window — SessionPolicy refuses that pair at startup rather
  # than letting it quietly disable one of the two rulers.
  sessions:
    idle: ${SKILLMASTER_SESSIONS_IDLE:24h}
    absolute: ${SKILLMASTER_SESSIONS_ABSOLUTE:7d}

  sms:
    # Blank credentials mean no provider is configured, which is a state this runs in on purpose:
    # the fallback sender either prints the code where a person can read it, or refuses to send.
    # It never reports success for a message it did not send. The signature and template have to be
    # approved before anything can be sent at all (TD §8, question 12).
    access-key-id: ${SKILLMASTER_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${SKILLMASTER_SMS_ACCESS_KEY_SECRET:}
    sign-name: ${SKILLMASTER_SMS_SIGN_NAME:}
    template-code: ${SKILLMASTER_SMS_TEMPLATE_CODE:}
    # Writes the verification code into the log — for a local run, where reading it out of the
    # terminal is the point of the exercise. Never enable this where the logs are not yours alone.
    log-codes: ${SKILLMASTER_SMS_LOG_CODES:false}
    # Accepts ANY six digits as the code, comparing nothing. It exists for one reason: no code can be
    # sent until a signature and a template have been approved, and that approval is on somebody
    # else's clock — so this keeps the whole registration and recovery flow exercisable in the
    # meantime, with the send, the five-minute window and the single use all still real.
    #
    # It must be off wherever anybody is being let in. With it on, six arbitrary digits register an
    # account whose phone number nobody proved they hold, and a password can be reset for any number
    # somebody types. Setting it while an access key is configured is refused at startup rather than
    # warned about. Turn it off — that line, nothing else — when the signature is approved.
    #
    # Only the *comparison* is skipped: the code must still be six digits, a row must still be
    # outstanding, it must still be unexpired and is still spent by being used. The test suite pins
    # this to false as a system property (pom.xml), because a system property outranks an exported
    # environment variable and the documented local workflow exports this one.
    accept-any-code: ${SKILLMASTER_SMS_ACCEPT_ANY_CODE:false}

  search:
    # What a hit in each field is worth. §3.4 makes the ranking the product's core — the directory
    # is not resident, so "there happens to be a skill for this" depends entirely on it — which is
    # why these are configuration rather than constants: the numbers are a starting point to be
    # tuned against real use, and tuning them should not need a release.
    #
    # They must not increase down the fields (name >= title >= description). RelevanceWeights
    # refuses a configuration that violates that at startup, since a description hit outranking a
    # name hit is always a mistake and would be nearly invisible in the results.
    weights:
      name: ${SKILLMASTER_WEIGHT_NAME:100}
      title: ${SKILLMASTER_WEIGHT_TITLE:40}
      description: ${SKILLMASTER_WEIGHT_DESCRIPTION:20}

  # How much of a comparison between two versions of a skill the browser may be shown (ADR 0031).
  # A diff is the one response here with no natural bound — two versions that share nothing produce
  # output proportional to both — so these are the caps, and what they cut is reported in the
  # response rather than passed off as the whole difference. See modules/distribution/DiffLimits,
  # which is what these bind to and where each one's meaning is written down.
  #
  # They are not security limits; a deployment that raises all three has chosen a bigger page, not a
  # weaker one. The defaults are the design's starting values.
  diff:
    # One file's ceiling, in bytes, on either side of the comparison. Past it the file is listed and
    # not line-diffed. 256 KiB: large enough for any ordinary SKILL.md or reference document, small
    # enough that the line algorithm is never run on something that would take a noticeable moment.
    max-file-bytes: ${SKILLMASTER_DIFF_MAX_FILE_BYTES:262144}
    # Hunk lines in one response — the number that actually bounds what the client renders. Also the
    # per-file line ceiling: a file whose own hunks exceed it is listed with no counts (GitLab's
    # line), so one giant file can never stop a batch from making progress.
    max-lines: ${SKILLMASTER_DIFF_MAX_LINES:5000}
    # Files whose bodies one response carries — one batch. The file *list* is not capped: statuses
    # and numstat come from the manifests, so a page can honestly say "and 411 more changed".
    max-files: ${SKILLMASTER_DIFF_MAX_FILES:20}

  gateway:
    # The $schema declared in the V2 discovery index. Deliberately empty, and the honest value:
    # §1.5 records that the URL lives under agentskills.io as the "v0.2.0 draft" and that it does
    # not currently resolve, so the exact string is not verifiable from here. Empty means the field
    # is omitted rather than filled with a guess — a wrong schema URL is worse than none, because a
    # client that validates against it would reject a document that is otherwise fine.
    # P0b's CLI check against a live `npx skills add` is what settles the real value.
    index-schema-url: ${SKILLMASTER_GATEWAY_SCHEMA_URL:}

  # How long a newly issued API key lives when the request does not name a date. ADR 0039 §决定 1
  # holds the number and its limits; ADR 0038 §决定 3 is why this is a setting at all.
  #
  # It constrains issuance only. Keys that already exist keep the date they were issued with — the
  # opposite behaviour, which the reference product has, is a settings change that silently kills
  # credentials people are using. A *renewal* is a new issuance and does take the current value.
  #
  # 90 days rather than the reference product's 365: that product's year is carried by a 60/30/7-day
  # reminder chain this product does not have, so a year here would mean every machine failing
  # silently on the same day with nobody told.
  api-keys:
    # Off means keys issued without a stated date never expire — the design's switch. A boolean
    # rather than "leave the lifetime empty", because the binder treats an empty value for a
    # duration as *the property was not set*, which takes the whole group with it and fails at
    # startup instead of issuing a key that never expires.
    expire: ${SKILLMASTER_API_KEYS_EXPIRE:true}
    # How long a key may live here: the lifetime a new key gets when the request did not name a date,
    # **and the longest date a request may name** — anything beyond it is refused with
    # `invalid_expiry` / `beyond_maximum` (ADR 0042). Renamed from `default-lifetime` when it stopped
    # being only a default: the old name said half of what the number now does.
    # Required even when `expire` is false, for the reason above: an absent value here unbinds the group.
    lifetime: ${SKILLMASTER_API_KEYS_LIFETIME:P90D}
    # How stale a key's recorded use has to be before the next request rewrites it. The request path
    # is otherwise read-only and must stay that way — every command an agent runs hits it — so this
    # is what keeps a key in constant use cost a handful of writes an hour. It is also the sampling
    # rate of the "used from a new address" signal, which is written with the stamp.
    last-used-window: ${SKILLMASTER_API_KEYS_LAST_USED_WINDOW:PT10M}

  # How long tokens live, and how much of a refresh race is forgiven (§3.1, ADR 0024). Every one of
  # these has the design's value as its default, so a deployment that says nothing gets the design.
  # They are here rather than only in the record because a nested group with no property under it is
  # simply absent to the binder — `Tokens` would arrive null and startup would fail. The
  # `@DefaultValue`s are what make an individual key omittable, not what makes the group exist.
  #
  # Durations are ISO-8601, which is what `Duration` binds from: PT1H rather than 1h. The verbose
  # form is the one that cannot be misread — `1m` is a minute to Spring and reads as a month to
  # somebody skimming, and this is a file people skim.
  tokens:
    # The credential every request carries, and therefore both the window a stolen one is worth
    # something in and how often the CLI refreshes. Short on purpose; it is the one number here that
    # a person can feel, because a refresh is a round trip.
    access-token: ${SKILLMASTER_ACCESS_TOKEN_TTL:PT1H}
    # The idle ruler: a refresh token nobody has touched for this long is gone.
    refresh-token-idle: ${SKILLMASTER_REFRESH_TOKEN_IDLE_TTL:P30D}
    # The other ruler, and not a lifetime of any single token: a ceiling on the whole
    # authorization. It is the reason a forgotten credential stops working, and the reason a person
    # is asked "still you?" at least this often. Must not be shorter than the idle lifetime —
    # TokenPolicy refuses that at startup, because it would disable the idle rule without saying so.
    refresh-token-absolute: ${SKILLMASTER_REFRESH_TOKEN_ABSOLUTE_TTL:P180D}
    # Minutes. Its life only has to cover the trip from the browser back to the machine that asked.
    authorization-code: ${SKILLMASTER_AUTHORIZATION_CODE_TTL:PT5M}
    # How long after a rotation a spent refresh token counts as a race rather than a replay (ADR
    # 0024). Seconds, and the window's length is exactly how long a stolen token can be used without
    # being noticed — which is the whole reason it is not longer.
    refresh-replay-grace: ${SKILLMASTER_REFRESH_REPLAY_GRACE:PT60S}
    # The sampling window of the CLI login's sliding expiry (v4): a request rewrites the recorded
    # expiry only when it is more than this stale, which is what keeps that path near read-only. It
    # is also how early the idle ruler may fire, so it has to stay far below it — CliSignInPolicy
    # refuses a window above a tenth of `sessions.idle` at startup. Note where that check lives: the
    # rulers themselves are `sessions`' and only this window is here, which is why TokenPolicy is not
    # the thing doing the checking.
    activity-window: ${SKILLMASTER_ACTIVITY_WINDOW:PT5M}

# NOTE: this file IS Maven-filtered (spring-boot-starter-parent sets the resource delimiter to
# '@'), so an '@' in any value here would be substituted at build time. Keep credentials in
# environment variables rather than inlining a value that could contain one.
