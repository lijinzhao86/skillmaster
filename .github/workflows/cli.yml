# The CLI's tests are the only place two of this project's contracts are actually
# executed rather than read: the help text every command prints, and the exit codes
# scripts branch on (ADR 0087). Until now they only ran on a laptop, which meant the
# file-backed credential store — the one every platform falls back to, and the only
# one a runner has — was never exercised anywhere.
name: CLI

# **No `paths:` filter.** The workflow starts on every pull request and every push so
# its required checks always report; the `changes` job decides whether the CLI moved
# (`.github/scripts/changed-paths.sh`).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: CLI changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cli: ${{ steps.which.outputs.cli }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Which module moved
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)')"
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            # A branch's first push has no commit to compare against; every module counts
            # as touched.
            files=""
          else
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$HEAD_SHA" \
              --jq '.files[] | .filename, (.previous_filename // empty)')"
          fi
          if [ -z "$files" ]; then
            # An empty answer is not "nothing changed" — a push and a pull request both
            # always touch something. Treat it as unknown and run the checks.
            result="cli=true"
          else
            result="$(printf '%s\n' "$files" | bash "$GITHUB_WORKSPACE/.github/scripts/changed-paths.sh" cli)"
          fi
          echo "$result"
          echo "$result" >> "$GITHUB_OUTPUT"

  test:
    name: Test and vet
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillmaster-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The version comes from go.mod, so the toolchain cannot drift from what the
      # module declares.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: skillmaster-cli/go.mod
          cache-dependency-path: skillmaster-cli/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # **The directive that makes macOS work is invisible on this runner.** //go:debug
      # x509usefallbackroots=1 lives in a darwin-tagged file and no job here runs on macOS — but the
      # setting is compiled in, so listing the darwin build is enough to catch a deletion, a typo in
      # the build constraint, or a move back into the shared file, where it would replace the system
      # trust store on every platform (ADR 0167).
      - name: The macOS build forces the Go verifier, and Linux does not
        run: |
          set -o pipefail
          GOOS=darwin go list -f '{{.DefaultGODEBUG}}' ./cmd/skillmaster | grep -q 'x509usefallbackroots=1'
          if GOOS=linux go list -f '{{.DefaultGODEBUG}}' ./cmd/skillmaster | grep -q 'x509usefallbackroots=1'; then
            echo "Linux must keep the system trust store: the macOS-only directive leaked out."; exit 1
          fi

      # **No session D-Bus on a runner**, so `credentials.Open` takes its file branch
      # (see keychain_linux.go): the help side-effect test seeds and reads back an
      # 0600 file there, which is the branch a headless machine actually uses.
      - name: Test
        run: go test -count=1 ./...

  # **Why this job exists at all**: v25's updater replaces the running executable, and on Windows
  # that path is a different program (a helper that renames the staged binary into place once the
  # parent is gone). None of it can be exercised on the Linux runner.
  #
  # It runs a deliberately narrow set rather than the whole suite: what Windows adds is the
  # compilation of the windows-tagged files, the updater's own tests, and the end-to-end swap. The
  # rest of the suite has never run on Windows and making it a gate here would turn this job into a
  # porting project; that is a separate decision.
  windows:
    name: The update path on Windows
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: skillmaster-cli
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: skillmaster-cli/go.mod
          cache-dependency-path: skillmaster-cli/go.sum

      - name: Build for Windows
        run: go build ./...

      - name: The updater's Windows files compile and pass their tests
        run: go test -count=1 ./internal/updater ./internal/prompt

      # **A real parent process, two real binaries.** The helper waits for the process that started
      # it to exit, so nothing inside one test process can watch the swap happen.
      - name: The helper replaces the running binary
        env:
          SKILLMASTER_E2E_UPDATE: "1"
        run: go test -count=1 -v -run TestTheWindowsHelperReplacesTheRunningBinary ./cmd/skillmaster
