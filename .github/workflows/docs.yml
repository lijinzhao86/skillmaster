# The validator's own tests and lint. The checks it implements against this
# repository (shape, generated docs, references) run in `arch.yml`, which has no
# path filter — a PR that changes only a generator's source must still run them.
name: Docs

on:
  push:
    branches: [ main ]
    paths: &paths
      - 'docs/**'
      - '.claude/**'
      - 'scripts/docs/**'
      # `gateway/**` used to be here because the docs linked to its source; that directory is
      # gone (ADR 0096) and the link went with it.
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths: *paths

permissions:
  contents: read

jobs:
  validate:
    name: Validate documents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # The skill's scripts are a self-contained project: the validator, its tests
      # and its ruff config share a directory, so the pinned rule set is found
      # without passing --config.
      - name: Test and lint the validator
        working-directory: .claude/skills/docs-architecture/scripts
        run: |
          uv sync --locked
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .

      # The generators are stdlib-only scripts beside the validator, not part of
      # its package — but they are code, and they get the same lint.
      - name: Lint the docs tools
        working-directory: .claude/skills/docs-architecture/scripts
        run: |
          uv run ruff check ../../../../scripts/docs
          uv run ruff format --check ../../../../scripts/docs
