# The validator's own tests and lint. The checks it implements against this
# repository (shape, generated docs, references) run in `arch.yml`, which has no
# path filter — a PR that changes only a generator's source must still run them.
name: Docs

# **No `paths:` filter.** The workflow starts on every pull request and every push so
# its required check always reports; the `changes` job decides whether the documents or
# their tools moved (`.github/scripts/changed-paths.sh`).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Docs changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.which.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Which module moved
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)')"
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            # A branch's first push has no commit to compare against; every module counts
            # as touched.
            files=""
          else
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$HEAD_SHA" \
              --jq '.files[] | .filename, (.previous_filename // empty)')"
          fi
          if [ -z "$files" ]; then
            # An empty answer is not "nothing changed" — a push and a pull request both
            # always touch something. Treat it as unknown and run the checks.
            result="docs=true"
          else
            result="$(printf '%s\n' "$files" | bash "$GITHUB_WORKSPACE/.github/scripts/changed-paths.sh" docs)"
          fi
          echo "$result"
          echo "$result" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate documents
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # The skill's scripts are a self-contained project: the validator, its tests
      # and its ruff config share a directory, so the pinned rule set is found
      # without passing --config.
      - name: Test and lint the validator
        working-directory: .claude/skills/docs-architecture/scripts
        run: |
          uv sync --locked
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .

      # The generators are stdlib-only scripts beside the validator, not part of
      # its package — but they are code, and they get the same lint.
      - name: Lint the docs tools
        working-directory: .claude/skills/docs-architecture/scripts
        run: |
          uv run ruff check ../../../../scripts/docs
          uv run ruff format --check ../../../../scripts/docs
