# Publishing the CLI. The rules — which packages, what they are called, in which order they land
# and why only a formal tag uploads — are skillmaster-cli/RELEASE.md §1–§7. This file implements
# them; when the two disagree, that document wins.
#
# **A tag is the only trigger.** Merging to main runs the tests (cli.yml) and publishes nothing:
# the release cadence and the merge cadence are separate decisions.
#
# **`-rc` tags build and do not upload.** That is how the pipeline is exercised without putting a
# prerelease on the download site, which only ever carries formal versions.
name: CLI release

on:
  push:
    tags:
      - 'cli/v*'

permissions:
  contents: read

env:
  # §6: one bucket, one endpoint, and the artifact names carry no version, so the download URLs
  # never change. The values are here rather than in a secret because they are not sensitive; the
  # credentials are.
  OSS_BUCKET: skillmaster-dl

jobs:
  build:
    name: Build every package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      formal: ${{ steps.version.outputs.formal }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The ancestry check below needs the real history, not the single tagged commit.
          fetch-depth: 0

      # §2: a tag that is not in main's history is refused. Otherwise a release can be cut from the
      # middle of a branch, and the thing users download has never been reviewed as a whole.
      - name: The tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not an ancestor of main — release from main only"
            exit 1
          fi

      - name: Read the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#cli/v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not carry a version (expected cli/v1.2.3)"
            exit 1
          fi
          case "$version" in
            *-*) echo "formal=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "formal=true"  >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version (formal: $(grep -q '^formal=true' "$GITHUB_OUTPUT" && echo yes || echo no))"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: skillmaster-cli/go.mod
          cache-dependency-path: skillmaster-cli/go.sum

      # §3, §4: six packages, names without a version. The version lives in the binary and is
      # printed by `--version`; a name that carried it would break every download URL on release.
      # **The server address is compiled in, and it is the one the server publishes.** `config`
      # defaults to `http://localhost:8080` on purpose — a default that pointed at production
      # would let one slip of a command hand a credential to the wrong server — so a release that
      # forgets to overwrite it is a binary that talks to nobody. It reads the same repository
      # variable the deployment renders into `SKILLMASTER_PUBLIC_BASE_URL`, so the address the CLI
      # dials and the `issuer` the server claims cannot drift apart: they are one value.
      - name: Cross-compile and package
        working-directory: skillmaster-cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SERVER: ${{ vars.SKILLMASTER_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER" ]; then
            echo "::error::vars.SKILLMASTER_PUBLIC_BASE_URL is empty — a release built without it talks to localhost"
            exit 1
          fi
          echo "the binary will dial $SERVER"
          # One string, appended line by line: `go build -ldflags` splits on whitespace, and a
          # value carrying a newline or leading indentation is a thing to find out about in CI.
          ldflags="-s -w"
          ldflags="$ldflags -X github.com/lijinzhao86/skillmaster/skillmaster-cli/internal/version.Version=${VERSION}"
          ldflags="$ldflags -X github.com/lijinzhao86/skillmaster/skillmaster-cli/internal/config.DefaultServer=${SERVER}"
          # Absolute paths, because two of the three commands below change directory: a
          # relative archive name means one thing here and another inside `( cd … )`. The
          # first rehearsal shipped the tar files to the repository root and the zips to
          # `dist/`, and the checksum step then found nothing (cli/v1.0.0-rc1).
          root="$(cd .. && pwd)"
          build="$root/.build"
          dist="$root/dist"
          mkdir -p "$build" "$dist"

          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            out="$build/${os}-${arch}"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$ldflags" -o "${out}/skillmaster${ext}" ./cmd/skillmaster

            name="skillmaster_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd "$out" && zip -q -9 "$dist/${name}.zip" "skillmaster.exe")
            else
              # `-C <dir> skillmaster` puts the binary at the archive root — install.sh copies
              # `$tmp/skillmaster` after extracting, so a wrapping directory would break it.
              tar -czf "$dist/${name}.tar.gz" -C "$out" skillmaster
            fi
            echo "built ${name}"
          done

      # §6: the checksum file describes exactly the six files above, and it is uploaded before the
      # install scripts so a script that can be fetched can already be verified.
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -1 skillmaster_*.tar.gz skillmaster_*.zip > /dev/null
          sha256sum skillmaster_*.tar.gz skillmaster_*.zip > checksums.txt
          cat checksums.txt

      # The build exiting 0 does not mean the address went in: `-X` names a symbol, and a symbol
      # that does not exist is not an error. Ask the built binary instead of the command that
      # built it.
      - name: The binary carries the server address
        env:
          SERVER: ${{ vars.SKILLMASTER_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          tar -xzf dist/skillmaster_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          if ! grep -qaF "$SERVER" "$RUNNER_TEMP/skillmaster"; then
            echo "::error::skillmaster_linux_amd64 does not carry $SERVER — the ldflag did not take"
            exit 1
          fi
          echo "linux/amd64 carries $SERVER"

      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: cli-packages
          path: dist/*
          if-no-files-found: error

  publish:
    name: Upload the formal version
    needs: build
    if: needs.build.outputs.formal == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      # rclone's S3 backend speaks OSS's S3-compatible endpoint. One remote named `dl`, configured
      # entirely from the environment so nothing is written to disk.
      RCLONE_CONFIG_DL_TYPE: s3
      RCLONE_CONFIG_DL_PROVIDER: Alibaba
      RCLONE_CONFIG_DL_ACCESS_KEY_ID: ${{ secrets.OSS_DL_ACCESS_KEY_ID }}
      RCLONE_CONFIG_DL_SECRET_ACCESS_KEY: ${{ secrets.OSS_DL_ACCESS_KEY_SECRET }}
      RCLONE_CONFIG_DL_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch the packages
        uses: actions/download-artifact@v4
        with:
          name: cli-packages
          path: dist

      - name: Install rclone
        run: |
          if ! command -v rclone >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          fi
          rclone version | head -1

      # §6, in order: the six packages, then checksums.txt, then the two scripts. A reader that
      # receives a checksum always has the thing it describes; a script that can be fetched can
      # always be verified.
      - name: Upload packages, then the checksum file, then the scripts
        run: |
          set -euo pipefail
          upload() {
            rclone copyto --retries 3 --header-upload "Cache-Control: no-cache" \
              "$1" ":dl:${OSS_BUCKET}/$2"
          }
          for f in dist/skillmaster_*.tar.gz dist/skillmaster_*.zip; do upload "$f" "$(basename "$f")"; done
          upload dist/checksums.txt checksums.txt
          upload skillmaster-cli/install/install.sh install.sh
          upload skillmaster-cli/install/install.ps1 install.ps1

      # The release is not "done" because the upload exited 0 — ask the public URL what it serves,
      # and check the bytes against the checksum that was just published.
      - name: The public address serves what was just published
        run: |
          set -euo pipefail
          base="https://dl.skillmasterai.com"
          for f in dist/skillmaster_*.tar.gz dist/skillmaster_*.zip; do
            name="$(basename "$f")"
            curl -fsSL --retry 5 --retry-delay 3 -o "/tmp/$name" "$base/$name"
            want="$(awk -v n="$name" '$2 == n { print $1 }' dist/checksums.txt)"
            got="$(sha256sum "/tmp/$name" | awk '{ print $1 }')"
            [ "$want" = "$got" ] || { echo "::error::$name differs from checksums.txt at $base"; exit 1; }
          done
          echo "all six packages are downloadable and match checksums.txt"
