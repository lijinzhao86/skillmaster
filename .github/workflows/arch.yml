# Guards that do not need a build: file-size limits and document shape.
#
# They run on every pull request rather than behind a path filter: a new file can appear
# anywhere, and the check is cheap enough that filtering would only hide the one PR that
# needed it.
name: Architecture

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  guards:
    name: Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: skillmaster-console/.nvmrc

      - name: File size
        run: node scripts/check-file-size.mjs

      - name: Docs
        run: python3 .claude/skills/docs-architecture/scripts/check_docs.py
