# Run the open-source import now, without deploying anything.
#
# Since v69 the import lives in skillmaster-ops on the second ECS (ADR 0199). The operation is one
# loopback POST there, then a poll of the run: the trigger answers 202 with a run id, because a
# first import can take longer than any sane HTTP request. The workflow builds nothing, publishes
# nothing and restarts nothing.
name: Sync trigger

on:
  workflow_dispatch:

# A second click waits rather than starting a parallel run. ops answers 409 to a concurrent run;
# this only keeps the ordinary case from producing two queued jobs.
concurrency:
  group: sync-trigger
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger:
    name: Trigger
    runs-on: ubuntu-latest
    # GitHub's own ceiling, not the wait: the wait is `SYNC_TRIGGER_TIMEOUT_MINUTES`, read and
    # checked in the step below. A variable cannot go into this line — an expression here is
    # evaluated before any step runs, so a value that is not a number would kill the job with a
    # parse error instead of the step's message.
    timeout-minutes: 360
    steps:
      - name: Run the import and follow its run
        env:
          OPS_HOST: ${{ vars.OPS_HOST }}
          OPS_USER: ${{ vars.OPS_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          INNER_TOKEN: ${{ secrets.SKILLMASTER_INNER_TOKEN }}
          SYNC_TIMEOUT_MINUTES: ${{ vars.SYNC_TRIGGER_TIMEOUT_MINUTES || '60' }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_HOST:-}" ] || [ -z "${OPS_USER:-}" ]; then
            echo "::error::OPS_HOST and OPS_USER must be set to the operations machine" >&2
            exit 1
          fi
          if [ -z "${INNER_TOKEN:-}" ]; then
            echo "::error::SKILLMASTER_INNER_TOKEN is not set; ops would answer 404" >&2
            exit 1
          fi

          minutes="$SYNC_TIMEOUT_MINUTES"
          minutes="${minutes#"${minutes%%[!0]*}"}"
          if [ -z "$minutes" ] || [ "${#minutes}" -gt 3 ] || [ "$minutes" -lt 2 ] || [ "$minutes" -gt 350 ]; then
            echo "::error::SYNC_TRIGGER_TIMEOUT_MINUTES must be between 2 and 350, got '$SYNC_TIMEOUT_MINUTES'" >&2
            exit 1
          fi
          deadline=$(( minutes * 60 ))

          key="$RUNNER_TEMP/trigger_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          target="$OPS_USER@$OPS_HOST"
          opts=(-i "$key" -o StrictHostKeyChecking=accept-new
                -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${opts[@]}" "$target" true

          # The token travels over stdin rather than being interpolated into a remote shell
          # command: it is a credential, and a shell that re-parses it is one quoting bug away
          # from writing it into a log.
          answer="$(ssh "${opts[@]}" "$target" \
            "read -r token
             rm -f /tmp/ops-start; curl -sS --max-time 30 -o /tmp/ops-start -w '%{http_code}\\n' -X POST http://127.0.0.1:8090/inner/v1/jobs/import/runs \
               -H \"X-Inner-Token: \$token\" -H 'Content-Type: application/json' \
               -d '{\"trigger\":\"schedule\"}'; cat /tmp/ops-start" <<< "$INNER_TOKEN")"
          status="${answer%%$'\n'*}"
          payload="${answer#*$'\n'}"
          if [ "$status" = "409" ]; then
            echo "::notice::an import is already running; nothing started"
            exit 0
          fi
          if [ "$status" != "202" ]; then
            printf '%s\n' "$payload" >&2
            echo "::error::ops answered $status to the trigger" >&2
            exit 1
          fi
          run_id="$(printf '%s' "$payload" | jq -r '.run_id')"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::ops did not answer with a run id" >&2
            exit 1
          fi
          echo "run $run_id"

          # Poll until the run stops being `running`. The journal is not the source of truth any
          # more: the run row is, and it is the same row an operator reads.
          started=$(date +%s)
          while :; do
            body="$(ssh "${opts[@]}" "$target" \
              "read -r token
               curl -fsS --max-time 30 http://127.0.0.1:8090/inner/v1/jobs/runs/$run_id \
                 -H \"X-Inner-Token: \$token\"" <<< "$INNER_TOKEN")"
            status="$(printf '%s' "$body" | jq -r '.status')"
            if [ "$status" != "running" ]; then
              break
            fi
            if [ $(( $(date +%s) - started )) -gt "$deadline" ]; then
              echo "::error::the run did not finish in ${minutes} minutes; it keeps running on the host" >&2
              exit 1
            fi
            sleep 15
          done

          printf '%s\n' "$body" | jq -c '{
            run: .id, status, startedAt: .started_at, finishedAt: .finished_at,
            summary, error}'
          if [ "$status" = "failed" ]; then
            echo "::error::the import run failed" >&2
            exit 1
          fi
