# Run v50's open-source sync now, without deploying anything.
#
# The operation is one loopback POST on the host that already runs the server (ADR 0159). The
# workflow exists because the deployment host is where the SSH key and the trigger token already
# live; it builds nothing, publishes nothing and restarts nothing.
name: Sync trigger

on:
  workflow_dispatch:

# A second click waits rather than starting a parallel run. The server's own guard is the final
# word — this only keeps the ordinary case from producing two queued jobs.
concurrency:
  group: sync-trigger
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger:
    name: Trigger
    runs-on: ubuntu-latest
    # GitHub's own ceiling, not the wait: the wait is `SYNC_TRIGGER_TIMEOUT_MINUTES`, read and
    # checked in the step below. A variable cannot go into this line — an expression here is
    # evaluated before any step runs, so a value that is not a number would kill the job with a
    # parse error instead of the step's message.
    timeout-minutes: 360
    steps:
      - name: Run the sync and follow its progress
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SYNC_TRIGGER_TOKEN: ${{ secrets.SKILLMASTER_SYNC_TRIGGER_TOKEN }}
          SYNC_TIMEOUT_MINUTES: ${{ vars.SYNC_TRIGGER_TIMEOUT_MINUTES || '60' }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TRIGGER_TOKEN:-}" ]; then
            echo "SKILLMASTER_SYNC_TRIGGER_TOKEN is not set; the endpoint is not registered" >&2
            exit 1
          fi

          # How long the request may stay open. Two minutes is the floor: below that the SSH
          # handshakes alone could outlast the wait.
          minutes="$SYNC_TIMEOUT_MINUTES"
          case "$minutes" in
            ''|*[!0-9]*)
              echo "::error::SYNC_TRIGGER_TIMEOUT_MINUTES must be a whole number, got '$minutes'" >&2
              exit 1
              ;;
          esac
          # Leading zeros would make the arithmetic below read the value as octal (`090` is an
          # error, `020` is 16), and a very long number slips past `test` with an error status and
          # then overflows. Normalise first, then bound the length.
          minutes="${minutes#"${minutes%%[!0]*}"}"
          if [ -z "$minutes" ] || [ "${#minutes}" -gt 3 ]; then
            echo "::error::SYNC_TRIGGER_TIMEOUT_MINUTES must be between 2 and 350, got $SYNC_TIMEOUT_MINUTES" >&2
            exit 1
          fi
          if [ "$minutes" -lt 2 ] || [ "$minutes" -gt 350 ]; then
            echo "::error::SYNC_TRIGGER_TIMEOUT_MINUTES must be between 2 and 350, got $minutes" >&2
            exit 1
          fi
          # Thirty seconds short of the variable, so curl gives its answer instead of the floor
          # ending the step under it.
          deadline=$(( minutes * 60 - 30 ))

          key="$RUNNER_TEMP/trigger_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          opts=(-i "$key" -o StrictHostKeyChecking=accept-new
                -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)

          # One connection first: two that open at the same moment both write known_hosts.
          ssh "${opts[@]}" "$target" true

          # The server writes four lines: expansion starts, the run starts, one every ten entries,
          # one when it ends. Those lines are the only progress there is — the endpoint answers
          # once, at the end — so they are followed from here while the request is open. Entry
          # lines are left out on purpose: hundreds of them would bury the answer, and the summary
          # below names the failures. The pattern is the literal prefix of each line:
          # `sync run expanding`, `sync run started`, `sync progress done=`, `sync run finished` —
          # not `run=` (2026-11-07, first draft).
          # Its stderr goes to /dev/null rather than to the step's: the trap kills grep, and the
          # ssh on the other side of that pipe would otherwise keep the step's error stream open
          # until the remote timeout fired — a finished run that still looks like it is running.
          # `--since '2 min ago'` covers a slow handshake: the lines we care about are written
          # after the POST below, and a couple of stale ones are harmless.
          ssh "${opts[@]}" "$target" \
            "timeout ${deadline}s journalctl -u skillmaster -f -o cat --since '2 min ago'" \
            2>/dev/null | grep --line-buffered -E 'sync (run|progress) ' &
          tailer=$!
          trap 'sleep 2; kill "$tailer" 2>/dev/null || true' EXIT
          sleep 1
          if ! kill -0 "$tailer" 2>/dev/null; then
            echo "::warning::the progress tail did not start; the run itself is unaffected" >&2
          fi

          # The token travels over stdin rather than being interpolated into a remote shell
          # command: it is a credential, and a shell that re-parses it is one quoting bug away from
          # writing it into a log.
          body="$(ssh "${opts[@]}" "$target" \
            "read -r token
             curl -fsS --max-time ${deadline} -X POST http://127.0.0.1:8080/internal/sync/run \
               -H \"X-Sync-Trigger: \$token\"" <<< "$SYNC_TRIGGER_TOKEN")"

          # The report is one line per expanded entry — hundreds on a first import. Counts and the
          # named failures are what an operator reads. Anything that is not the report is printed
          # as it came, and fails the step: a 200 that is not a report is not a result.
          if ! printf '%s\n' "$body" | jq -e '.entries | type == "array"' >/dev/null 2>&1; then
            printf '%s\n' "$body"
            echo "::error::the endpoint answered something that is not a sync report" >&2
            exit 1
          fi
          printf '%s\n' "$body" | jq -c '{
            startedAt: .started_at,
            finishedAt: .finished_at,
            entries: (.entries | length),
            results: (.entries | group_by(.result)
                      | map({key: .[0].result, value: length}) | from_entries),
            failed: [.entries[] | select(.result == "failed")
                     | {locator, path, reason}]}'
