# A merge proves the code builds; a deployment is a separate, deliberate run.
#
# That split is the whole point of this file. A merge to main is a decision about code,
# and putting a commit in front of every user is a different decision - so a merge runs
# the tests and builds the jar, and production changes only when somebody runs this
# workflow by hand.
#
# **Why a jar and not an image.** The host runs one service on one machine, and its
# registry options are poor: Aliyun's personal edition is closed to new accounts and its
# economy tier costs more per year than this service's whole infrastructure. A jar plus
# a `releases/<sha>` directory gives what a registry would give here - versioned
# artifacts and an atomic, reversible switch - without a second cloud account or a
# service with no SLA. skillmaster-server/Dockerfile is still built on every push so it
# cannot rot; the day this needs more than one machine, that path is ready.
#
# **Where the values live.** Credentials are repository *secrets*; everything else the
# deployment needs is a repository *variable*. The deploy job renders both into
# /etc/skillmaster/server.env, so production configuration has one source instead of a
# file edited by hand on the host. Local development keeps its own `.env`, which never
# leaves the machine - see the root `.env.example`.
name: Server

on:
  push:
    branches: [ main ]
    paths: &paths
      - 'skillmaster-server/**'
      # The archived Python baseline is a design reference, not built code - editing it
      # must not trigger a Java build. (`reference-python/README.md` promises this.)
      - '!skillmaster-server/reference-python/**'
      # The jar carries the gateway skill: pom.xml copies gateway/ onto the classpath,
      # so a change there is a change to the server.
      - 'gateway/**'
      # .dockerignore decides what the image build below can see.
      - '.dockerignore'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [ main ]
    paths: *paths
  workflow_dispatch:
    inputs:
      release:
        description: 'Release to deploy: leave "new" to build this ref, or name an existing one to point production back at it'
        required: true
        default: 'new'

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillmaster-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ./mvnw downloads its own Maven, so the runner needs a JDK and nothing else.
      - name: Test
        run: ./mvnw -B verify

  build:
    name: Build
    # A pull request runs the tests alone. Building the jar and the image is what a merge
    # does - and it is what keeps the deployment input in a known-good state.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillmaster-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package
        run: ./mvnw -B -DskipTests package

      # The one failure that only a real build can show: the server refuses to start when
      # GatewaySource cannot find gateway/skillmaster/SKILL.md on the classpath. It has
      # happened once. This asserts the resource is in the jar before anyone deploys it.
      - name: The jar carries the gateway skill
        run: |
          jar="$(ls target/skillmaster-server-*.jar | head -1)"
          if ! unzip -l "$jar" | grep -q 'BOOT-INF/classes/gateway/skillmaster/SKILL.md'; then
            echo "$jar does not carry the gateway skill; the server would refuse to start" >&2
            exit 1
          fi

      # Not deployed from, but built on every merge so it cannot rot: the day this needs
      # a registry or more than one machine, the image path is already known to work.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: skillmaster-server/Dockerfile
          push: false
          cache-from: type=gha,scope=image-skillmaster
          cache-to: type=gha,scope=image-skillmaster,mode=max

  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package
        if: inputs.release == 'new'
        working-directory: skillmaster-server
        run: ./mvnw -B -DskipTests package

      - name: Render the environment
        env:
          DB_URL: ${{ vars.SKILLMASTER_DB_URL }}
          DB_USER: ${{ vars.SKILLMASTER_DB_USER }}
          DB_PASSWORD: ${{ secrets.SKILLMASTER_DB_PASSWORD }}
          PUBLIC_BASE_URL: ${{ vars.SKILLMASTER_PUBLIC_BASE_URL }}
          COOKIE_DOMAIN: ${{ vars.SKILLMASTER_COOKIE_DOMAIN }}
          SITE_ORIGIN: ${{ vars.SKILLMASTER_SITE_ORIGIN }}
          PHONE_HMAC_KEY: ${{ secrets.SKILLMASTER_PHONE_HMAC_KEY }}
          PHONE_ENC_KEY: ${{ secrets.SKILLMASTER_PHONE_ENC_KEY }}
          SMS_KEY_ID: ${{ secrets.SKILLMASTER_SMS_ACCESS_KEY_ID }}
          SMS_KEY_SECRET: ${{ secrets.SKILLMASTER_SMS_ACCESS_KEY_SECRET }}
          SMS_SIGN_NAME: ${{ vars.SKILLMASTER_SMS_SIGN_NAME }}
          SMS_TEMPLATE_CODE: ${{ vars.SKILLMASTER_SMS_TEMPLATE_CODE }}
        run: |
          set -euo pipefail

          # A missing value would otherwise reach the host as an empty variable and
          # surface as a server that starts and then cannot connect. Fail here instead,
          # by name, before anything is touched.
          missing=""
          for name in DB_URL DB_USER DB_PASSWORD PUBLIC_BASE_URL COOKIE_DOMAIN SITE_ORIGIN \
                      PHONE_HMAC_KEY PHONE_ENC_KEY SMS_KEY_ID SMS_KEY_SECRET SMS_SIGN_NAME SMS_TEMPLATE_CODE; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "these repository variables/secrets are not set:$missing" >&2
            exit 1
          fi

          printf '%s\n' \
            "SKILLMASTER_DB_URL=$DB_URL" \
            "SKILLMASTER_DB_USER=$DB_USER" \
            "SKILLMASTER_DB_PASSWORD=$DB_PASSWORD" \
            "SKILLMASTER_PUBLIC_BASE_URL=$PUBLIC_BASE_URL" \
            "SKILLMASTER_COOKIE_DOMAIN=$COOKIE_DOMAIN" \
            "SKILLMASTER_SITE_ORIGIN=$SITE_ORIGIN" \
            "SKILLMASTER_PHONE_HMAC_KEY=$PHONE_HMAC_KEY" \
            "SKILLMASTER_PHONE_ENC_KEY=$PHONE_ENC_KEY" \
            "SKILLMASTER_SMS_ACCESS_KEY_ID=$SMS_KEY_ID" \
            "SKILLMASTER_SMS_ACCESS_KEY_SECRET=$SMS_KEY_SECRET" \
            "SKILLMASTER_SMS_SIGN_NAME=$SMS_SIGN_NAME" \
            "SKILLMASTER_SMS_TEMPLATE_CODE=$SMS_TEMPLATE_CODE" \
            "SKILLMASTER_SMS_LOG_CODES=false" \
            > server.env
          chmod 600 server.env

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          RELEASE: ${{ inputs.release }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          opts=(-i "$key" -o StrictHostKeyChecking=accept-new)

          # The rendered environment replaces the host's copy wholesale: the repository's
          # settings are the only source, so a value changed by hand does not survive.
          scp "${opts[@]}" server.env "$target:/etc/skillmaster/server.env"
          ssh "${opts[@]}" "$target" \
            'chown root:root /etc/skillmaster/server.env && chmod 600 /etc/skillmaster/server.env'

          if [ "$RELEASE" = "new" ]; then
            release="$SHA"
            ssh "${opts[@]}" "$target" "mkdir -p /opt/skillmaster/releases/$release"
            scp "${opts[@]}" skillmaster-server/target/skillmaster-server-*.jar \
              "$target:/opt/skillmaster/releases/$release/app.jar"
            ssh "${opts[@]}" "$target" \
              "chown -R skillmaster:skillmaster /opt/skillmaster/releases/$release"
          else
            release="$RELEASE"
            # A named release is a rollback: the jar is already on the host.
            ssh "${opts[@]}" "$target" "test -f /opt/skillmaster/releases/$release/app.jar" || {
              echo "release $release is not on the host" >&2
              exit 1
            }
          fi

          # The switch is one rename of a symlink, so a running server is never left
          # pointing at half a directory.
          ssh "${opts[@]}" "$target" \
            "set -e
             ln -sfn /opt/skillmaster/releases/$release /opt/skillmaster/current.new
             mv -T /opt/skillmaster/current.new /opt/skillmaster/current
             systemctl restart skillmaster
             # Keep the last five; older ones are no longer rollback targets.
             ls -1dt /opt/skillmaster/releases/*/ | tail -n +6 | xargs -r rm -rf"

          # The deploy is not done until the service answers with the issuer it was
          # configured with - a process that started is not the same thing.
          sleep 10
          ssh "${opts[@]}" "$target" \
            'curl -fsS --max-time 10 http://127.0.0.1:8080/.well-known/oauth-authorization-server >/dev/null'
          echo "deployed $release"
