# A merge proves the code builds; a deployment is a separate, deliberate run.
#
# That split is the whole point of this file. A merge to main is a decision about code,
# and putting a commit in front of every user is a different decision - so a merge runs
# the tests and builds the jar, and production changes only when somebody runs this
# workflow by hand.
#
# **Why a jar and not an image.** The host runs one service on one machine, and its
# registry options are poor: Aliyun's personal edition is closed to new accounts and its
# economy tier costs more per year than this service's whole infrastructure. A jar plus
# a `releases/<sha>` directory gives what a registry would give here - versioned
# artifacts and an atomic, reversible switch - without a second cloud account or a
# service with no SLA. skillmaster-server/Dockerfile is still built on every push so it
# cannot rot; the day this needs more than one machine, that path is ready.
#
# **Where the values live.** Credentials are repository *secrets*; everything else the
# deployment needs is a repository *variable*. The deploy job renders both into
# /etc/skillmaster/server.env, so production configuration has one source instead of a
# file edited by hand on the host. Local development keeps its own `.env`, which never
# leaves the machine - see the root `.env.example`.
name: Server

# **No `paths:` filter.** Which module a change touches is decided by the `changes` job
# below, from `.github/scripts/changed-paths.sh`. A filter here would make the required
# `Test` check disappear on a pull request that changes only documents, and a required
# check that never reports blocks the merge forever.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Release to deploy: "new" (default) uses the green Build for this ref; a full 40-character sha points production at that existing release and requires confirm_rollback'
        required: true
        default: 'new'
      confirm_rollback:
        description: 'Required when release is a sha: type rollback (exact, lowercase) to confirm pointing production at an existing release'
        required: false
        default: ''

permissions:
  contents: read
  # `changes` asks the pull request / compare API which files moved; `deploy` asks the
  # Actions API for the Build that produced this commit.
  pull-requests: read
  actions: read

jobs:
  changes:
    name: Server changes
    # A dispatch deploys a commit that already merged, so there is nothing to decide; the
    # deploy job itself requires a green Build for that commit.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.which.outputs.server }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Which module moved
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)')"
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            # A branch's first push has no commit to compare against; every module counts
            # as touched.
            files=""
          else
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$HEAD_SHA" \
              --jq '.files[] | .filename, (.previous_filename // empty)')"
          fi
          if [ -z "$files" ]; then
            # An empty answer is not "nothing changed" — a push and a pull request both
            # always touch something. Treat it as unknown and run the checks.
            result="server=true"
          else
            result="$(printf '%s\n' "$files" | bash "$GITHUB_WORKSPACE/.github/scripts/changed-paths.sh" server)"
          fi
          echo "$result"
          echo "$result" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillmaster-server
    # The integration tests run against a real PostgreSQL (application-test.yml): the
    # schema leans on partial indexes, ON CONFLICT, bytea and collation, and an embedded
    # database would test a different product. Without this service every *IT fails on
    # connection refused - which is a failure, not a skip, and that is the point.
    services:
      postgres:
        # **The pgvector image, not plain postgres** (v19). V30__skill_embeddings.sql creates
        # `vector(1024)` and a `CREATE EXTENSION vector`; against an image without the extension
        # every context-loading test dies during migration. The tag pins the PostgreSQL major,
        # because that is what the extension build ships for.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: skillmaster
          POSTGRES_PASSWORD: skillmaster
          POSTGRES_DB: skillmaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillmaster -d skillmaster_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SKILLMASTER_TEST_DB_USER: skillmaster
      SKILLMASTER_TEST_DB_PASSWORD: skillmaster
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ./mvnw downloads its own Maven, so the runner needs a JDK and nothing else.
      - name: Test
        run: ./mvnw -B verify

  build:
    name: Build
    # A pull request runs the tests alone. Building the jar and the image is what a merge
    # does - and it is what keeps the deployment input in a known-good state.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillmaster-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package
        run: ./mvnw -B -DskipTests package

      # **The journey is not in the jar any more, and that absence is the thing to assert**
      # (ADR 0096). A build that quietly started carrying `gateway/` again would mean two homes
      # for the text — the failure this ADR removed — so the check is that it is gone.
      - name: The jar carries no journey of its own
        run: |
          jar="$(ls target/skillmaster-server-*.jar | head -1)"
          if unzip -l "$jar" | grep -q 'BOOT-INF/classes/gateway/'; then
            echo "$jar carries gateway/ assets; the journey belongs to the skillmaster/startup skill" >&2
            exit 1
          fi

      # **The deploy downloads this artifact instead of rebuilding.** Production then runs
      # the bytes this job tested, not a second build that merely came from the same commit.
      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: skillmaster-server/target/skillmaster-server-*.jar
          if-no-files-found: error
          # A re-run of this job reuses the run id; without this the second attempt fails
          # on the name the first one left behind.
          overwrite: true

      # Not deployed from, but built on every merge so it cannot rot: the day this needs
      # a registry or more than one machine, the image path is already known to work.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: skillmaster-server/Dockerfile
          push: false
          cache-from: type=gha,scope=image-skillmaster
          cache-to: type=gha,scope=image-skillmaster,mode=max

  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch'
    # **One deploy at a time.** Two dispatches can be started seconds apart (2026-11-11: a
    # rollback was dispatched while the v59 deploy was still probing). Without this, both switch
    # the symlink and restart the service, the last one wins, and a job can report "deployed" for
    # a release that is no longer in service. `cancel-in-progress: false` keeps the running one;
    # GitHub still holds only one *waiting* run per group, so a third dispatch replaces the
    # pending one rather than queueing behind it.
    concurrency:
      group: server-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # **The deploy does not build.** It requires that `Build` passed for this exact
      # commit and downloads the artifact that job uploaded; a commit without one fails
      # here, before anything reaches the host. A named release is a rollback and already
      # has its jar on the host.
      - name: Require the Build this commit passed
        id: build
        if: inputs.release == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run_id=""
          while read -r candidate; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/jobs" \
              --jq '.jobs[] | select(.name == "Build") | .conclusion')"
            if [ "$conclusion" = "success" ]; then
              run_id="$candidate"
              break
            fi
          # Same as console.yml: no `status=success` — that index lags; the job conclusion is the gate.
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/server.yml/runs?head_sha=$SHA&event=push&per_page=20" --jq '.workflow_runs[].id')
          if [ -z "$run_id" ]; then
            echo "::error::no successful Build for $SHA; name a release that already has one"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the jar Build produced
        if: inputs.release == 'new'
        uses: actions/download-artifact@v4
        with:
          name: server-jar
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: skillmaster-server/target

      - name: Render the environment
        env:
          DB_URL: ${{ vars.SKILLMASTER_DB_URL }}
          DB_USER: ${{ vars.SKILLMASTER_DB_USER }}
          DB_PASSWORD: ${{ secrets.SKILLMASTER_DB_PASSWORD }}
          PUBLIC_BASE_URL: ${{ vars.SKILLMASTER_PUBLIC_BASE_URL }}
          COOKIE_DOMAIN: ${{ vars.SKILLMASTER_COOKIE_DOMAIN }}
          SITE_ORIGIN: ${{ vars.SKILLMASTER_SITE_ORIGIN }}
          PHONE_HMAC_KEY: ${{ secrets.SKILLMASTER_PHONE_HMAC_KEY }}
          PHONE_ENC_KEY: ${{ secrets.SKILLMASTER_PHONE_ENC_KEY }}
          SMS_KEY_ID: ${{ secrets.SKILLMASTER_SMS_ACCESS_KEY_ID }}
          SMS_KEY_SECRET: ${{ secrets.SKILLMASTER_SMS_ACCESS_KEY_SECRET }}
          SMS_SIGN_NAME: ${{ vars.SKILLMASTER_SMS_SIGN_NAME }}
          SMS_TEMPLATE_CODE: ${{ vars.SKILLMASTER_SMS_TEMPLATE_CODE }}
          # v39 / v58. Private OSS for large blobs and the 90-day archive. All optional: blank
          # means every blob stays in PostgreSQL and the archive job refuses at upload, which is
          # the local default. A deployment that turns it on needs endpoint + bucket and either a
          # key pair or an ECS RAM role (checked below).
          OSS_ENABLED: ${{ vars.SKILLMASTER_OSS_ENABLED }}
          OSS_ENDPOINT: ${{ vars.SKILLMASTER_OSS_ENDPOINT }}
          OSS_BUCKET: ${{ vars.SKILLMASTER_OSS_BUCKET }}
          OSS_KEY_ID: ${{ secrets.SKILLMASTER_OSS_ACCESS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.SKILLMASTER_OSS_ACCESS_KEY_SECRET }}
          OSS_ROLE_NAME: ${{ vars.SKILLMASTER_OSS_ROLE_NAME }}
          # v19. The switch is a repository *variable* and defaults to off; the key is a secret and
          # is required only when the switch is on (checked below, by name).
          RETRIEVAL_ENABLED: ${{ vars.SKILLMASTER_RETRIEVAL_ENABLED }}
          DASHSCOPE_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          # v50. Off unless the variable says otherwise; the token and the sources file are
          # required only when it is on (checked below, by name).
          SYNC_ENABLED: ${{ vars.SKILLMASTER_SYNC_ENABLED }}
          SYNC_SOURCES_FILE: ${{ vars.SKILLMASTER_SYNC_SOURCES_FILE }}
          SYNC_CRON: ${{ vars.SKILLMASTER_SYNC_CRON }}
          SYNC_MAX_REPO_BYTES: ${{ vars.SKILLMASTER_SYNC_MAX_REPO_BYTES }}
          SYNC_MAX_UNPACKED_BYTES: ${{ vars.SKILLMASTER_SYNC_MAX_UNPACKED_BYTES }}
          GITHUB_TOKEN: ${{ secrets.SKILLMASTER_GITHUB_TOKEN }}
          SYNC_TRIGGER_TOKEN: ${{ secrets.SKILLMASTER_SYNC_TRIGGER_TOKEN }}
          # v52. The sealer is a variable and must say `huawei` here (`aliyun` is the kept
          # alternative); the CMK, its region and the identity that may use it are the secrets.
          # `local` is refused on the prod profile.
          SECRET_SEALER: ${{ vars.SKILLMASTER_SECRET_SEALER }}
          SECRET_KMS_KEY_ID: ${{ secrets.SKILLMASTER_SECRET_KMS_KEY_ID }}
          SECRET_KMS_REGION: ${{ vars.SKILLMASTER_SECRET_KMS_REGION }}
          SECRET_ACCESS_KEY_ID: ${{ secrets.SKILLMASTER_SECRET_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY_SECRET: ${{ secrets.SKILLMASTER_SECRET_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail

          # A missing value would otherwise reach the host as an empty variable and
          # surface as a server that starts and then cannot connect. Fail here instead,
          # by name, before anything is touched.
          missing=""
          for name in DB_URL DB_USER DB_PASSWORD PUBLIC_BASE_URL COOKIE_DOMAIN SITE_ORIGIN \
                      PHONE_HMAC_KEY PHONE_ENC_KEY SMS_KEY_ID SMS_KEY_SECRET SMS_SIGN_NAME SMS_TEMPLATE_CODE \
                      SECRET_SEALER SECRET_KMS_KEY_ID SECRET_KMS_REGION; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "these repository variables/secrets are not set:$missing" >&2
            exit 1
          fi

          # Semantic retrieval is off unless the variable says otherwise (v19, ADR 0095). Turning it
          # on without a key would start a server that refuses every publish at its first call, so
          # the pair is checked together — and the failure names both.
          RETRIEVAL_ENABLED="${RETRIEVAL_ENABLED:-false}"
          if [ "$RETRIEVAL_ENABLED" = "true" ] && [ -z "$DASHSCOPE_KEY" ]; then
            echo "SKILLMASTER_RETRIEVAL_ENABLED is true but the DASHSCOPE_API_KEY secret is not set" >&2
            exit 1
          fi

          # Open-source sync is off unless the variable says otherwise (v50). The three settings
          # checked together are the ones its startup validation refuses to start without, so a
          # deploy that would half-enable it fails here instead.
          SYNC_ENABLED="${SYNC_ENABLED:-false}"
          # Spring's @ConditionalOnProperty compares the value with `havingValue` using
          # equalsIgnoreCase, so "TRUE" enables sync but "yes"/"on"/"1" do not. Mirror exactly
          # that: normalise case, do not treat other truthy spellings as enabled — doing so would
          # demand a token for a configuration the application leaves off.
          SYNC_ENABLED_NORMALIZED="$(printf '%s' "$SYNC_ENABLED" | tr '[:upper:]' '[:lower:]')"
          if [ "$SYNC_ENABLED_NORMALIZED" = "true" ]; then
            for name in SYNC_SOURCES_FILE GITHUB_TOKEN; do
              if [ -z "${!name}" ]; then
                echo "SKILLMASTER_SYNC_ENABLED is true but $name is not set" >&2
                exit 1
              fi
            done
          fi
          # The cron expression has no default here: when the variable is unset the line is not
          # written at all, so the application's own default in application.yml applies (the
          # value is in config.md). Writing a duplicated literal here would silently win over it.

          # The blob store follows the same rule: a partial configuration is refused here rather
          # than at the first large upload, and turning OSS on without a credential would start a
          # server whose blobs and cold archive cannot leave the host.
          OSS_ENABLED="${OSS_ENABLED:-false}"
          OSS_ENABLED_NORMALIZED="$(printf '%s' "$OSS_ENABLED" | tr '[:upper:]' '[:lower:]')"
          if [ "$OSS_ENABLED_NORMALIZED" = "true" ]; then
            for name in OSS_ENDPOINT OSS_BUCKET; do
              if [ -z "${!name}" ]; then
                echo "SKILLMASTER_OSS_ENABLED is true but $name is not set" >&2
                exit 1
              fi
            done
            if [ -z "$OSS_KEY_ID" ] && [ -z "$OSS_ROLE_NAME" ]; then
              echo "SKILLMASTER_OSS_ENABLED is true but neither an access key pair nor an ECS role name is set" >&2
              exit 1
            fi
            if [ -n "$OSS_KEY_ID" ] && [ -z "$OSS_KEY_SECRET" ]; then
              echo "SKILLMASTER_OSS_ACCESS_KEY_ID is set but SKILLMASTER_OSS_ACCESS_KEY_SECRET is not" >&2
              exit 1
            fi
          fi

          # v52: `local` would seal every user's credential with a key in a configuration file,
          # and the server only refuses it on the prod profile — which this file sets below. The
          # check is here so a deploy cannot half-configure the vault. Production seals with
          # Huawei Cloud KMS (`huawei`); `aliyun` is accepted as the alternative provider
          # (ADR 0172) and is the only other cloud value the server knows.
          case "$SECRET_SEALER" in
            huawei|aliyun) ;;
            *)
              echo "SKILLMASTER_SECRET_SEALER must be 'huawei' (or 'aliyun') for a deployment, was '$SECRET_SEALER'" >&2
              exit 1
              ;;
          esac

          # `huawei` needs the access-key pair: the host is an Aliyun ECS, so Huawei's default
          # credential chain (its own IMDS) has nothing to read and the server refuses the blank
          # pair at startup. `aliyun` may fall back to the host's RAM role, so it stays optional.
          if [ "$SECRET_SEALER" = "huawei" ] && { [ -z "${SECRET_ACCESS_KEY_ID:-}" ] \
               || [ -z "${SECRET_ACCESS_KEY_SECRET:-}" ]; }; then
            echo "SKILLMASTER_SECRET_ACCESS_KEY_ID and SKILLMASTER_SECRET_ACCESS_KEY_SECRET are required when SECRET_SEALER=huawei" >&2
            exit 1
          fi

          printf '%s\n' \
            "SPRING_PROFILES_ACTIVE=prod" \
            "SKILLMASTER_SECRET_SEALER=$SECRET_SEALER" \
            "SKILLMASTER_SECRET_KMS_KEY_ID=$SECRET_KMS_KEY_ID" \
            "SKILLMASTER_SECRET_KMS_REGION=$SECRET_KMS_REGION" \
            "SKILLMASTER_SECRET_ACCESS_KEY_ID=$SECRET_ACCESS_KEY_ID" \
            "SKILLMASTER_SECRET_ACCESS_KEY_SECRET=$SECRET_ACCESS_KEY_SECRET" \
            "SKILLMASTER_DB_URL=$DB_URL" \
            "SKILLMASTER_DB_USER=$DB_USER" \
            "SKILLMASTER_DB_PASSWORD=$DB_PASSWORD" \
            "SKILLMASTER_PUBLIC_BASE_URL=$PUBLIC_BASE_URL" \
            "SKILLMASTER_COOKIE_DOMAIN=$COOKIE_DOMAIN" \
            "SKILLMASTER_SITE_ORIGIN=$SITE_ORIGIN" \
            "SKILLMASTER_PHONE_HMAC_KEY=$PHONE_HMAC_KEY" \
            "SKILLMASTER_PHONE_ENC_KEY=$PHONE_ENC_KEY" \
            "SKILLMASTER_SMS_ACCESS_KEY_ID=$SMS_KEY_ID" \
            "SKILLMASTER_SMS_ACCESS_KEY_SECRET=$SMS_KEY_SECRET" \
            "SKILLMASTER_SMS_SIGN_NAME=$SMS_SIGN_NAME" \
            "SKILLMASTER_SMS_TEMPLATE_CODE=$SMS_TEMPLATE_CODE" \
            "SKILLMASTER_SMS_LOG_CODES=false" \
            "SKILLMASTER_RETRIEVAL_ENABLED=$RETRIEVAL_ENABLED" \
            "DASHSCOPE_API_KEY=$DASHSCOPE_KEY" \
            "SKILLMASTER_SYNC_ENABLED=$SYNC_ENABLED" \
            "SKILLMASTER_SYNC_SOURCES_FILE=$SYNC_SOURCES_FILE" \
            "SKILLMASTER_GITHUB_TOKEN=$GITHUB_TOKEN" \
            "SKILLMASTER_SYNC_TRIGGER_TOKEN=$SYNC_TRIGGER_TOKEN" \
            > server.env
          # OSS lines exist only when the switch is on, so an unset variable keeps the
          # application defaults (every blob in PostgreSQL, archive disabled) rather than writing
          # empty values that look configured.
          if [ "$OSS_ENABLED_NORMALIZED" = "true" ]; then
            printf '%s\n' \
              "SKILLMASTER_OSS_ENABLED=true" \
              "SKILLMASTER_OSS_ENDPOINT=$OSS_ENDPOINT" \
              "SKILLMASTER_OSS_BUCKET=$OSS_BUCKET" >> server.env
            if [ -n "$OSS_KEY_ID" ]; then
              printf '%s\n' \
                "SKILLMASTER_OSS_ACCESS_KEY_ID=$OSS_KEY_ID" \
                "SKILLMASTER_OSS_ACCESS_KEY_SECRET=$OSS_KEY_SECRET" >> server.env
            fi
            if [ -n "$OSS_ROLE_NAME" ]; then
              printf '%s\n' "SKILLMASTER_OSS_ROLE_NAME=$OSS_ROLE_NAME" >> server.env
            fi
          fi

          # A cron expression contains spaces, so the value is quoted: both systemd's
          # EnvironmentFile and `. server.env` strip the quotes and keep the spaces, while an
          # unquoted line would be sourced as `KEY=0` followed by the command `0`.
          if [ -n "${SYNC_CRON:-}" ]; then
            case "$SYNC_CRON" in
              *"'"*|*$'\n'*)
                echo "SKILLMASTER_SYNC_CRON must not contain quotes or newlines" >&2
                exit 1 ;;
            esac
            # Spring's cron has six fields (second minute hour day month weekday). A five-field
            # crontab expression is the common mistake; refuse it here instead of starting the
            # service and rolling back after the health probe.
            if [ "$(printf '%s' "$SYNC_CRON" | awk '{print NF}')" != "6" ]; then
              echo "SKILLMASTER_SYNC_CRON must have six fields (second minute hour day month weekday)" >&2
              exit 1
            fi
            printf '%s\n' "SKILLMASTER_SYNC_CRON='$SYNC_CRON'" >> server.env
          fi
          # Optional size ceilings for one synced repository. Unset leaves the application default
          # (see config.md); a set one is written as given, so 232 MB repositories can be allowed
          # without editing the jar's defaults.
          for pair in "SYNC_MAX_REPO_BYTES:SKILLMASTER_SYNC_MAX_REPO_BYTES" \
                      "SYNC_MAX_UNPACKED_BYTES:SKILLMASTER_SYNC_MAX_UNPACKED_BYTES"; do
            name="${pair%%:*}"
            key="${pair#*:}"
            value="${!name:-}"
            if [ -n "$value" ]; then
              # Fifteen digits is 999 TB: anything longer is a typo, and a value past the JVM's
              # long range would only fail later, at startup.
              if [ "${#value}" -gt 15 ]; then
                echo "$key is too large to be a byte count, got '$value'" >&2
                exit 1
              fi
              case "$value" in
                *[!0-9]*)
                  echo "$key must be a whole number of bytes, got '$value'" >&2
                  exit 1
                  ;;
                *[!0]*)
                  ;;
                *)
                  echo "$key must be greater than zero, got '$value'" >&2
                  exit 1
                  ;;
              esac
              printf '%s\n' "$key=$value" >> server.env
            fi
          done
          chmod 600 server.env

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          RELEASE: ${{ inputs.release }}
          CONFIRM_ROLLBACK: ${{ inputs.confirm_rollback }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE" =~ ^(new|[0-9a-f]{40})$ ]]; then
            echo "::error::release must be 'new' or a full 40-character commit sha" >&2
            exit 1
          fi
          # **A named release is a rollback, and it must say so.** The same button deploys this
          # ref's Build and points production back at an older commit; without this gate a
          # mistyped sha (or a second dispatch sent to "fix" the first) silently replaces the
          # running version. Fails before anything reaches the host.
          if [ "$RELEASE" != "new" ] && [ "$CONFIRM_ROLLBACK" != "rollback" ]; then
            echo "::error::release=$RELEASE points production back at an existing release; set confirm_rollback=rollback to confirm, or leave release=new to deploy this ref's Build" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          # **A stalled link has to fail, not wait.** On 2026-11-01 an upload of the 49MB jar sat
          # for twelve minutes with no output; with no `ConnectTimeout` and no keepalive, a
          # half-dead connection looks exactly like a slow one and would rest there until the
          # job's six-hour ceiling. The keepalive turns silence into a failure within a minute,
          # and `timeout` below bounds a single upload attempt on top of that.
          opts=(-i "$key" -o StrictHostKeyChecking=accept-new
                -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)

          # Keep the previous configuration before replacing it. A deploy that fails after this
          # point restores these: the running release reads its configuration only at startup, so
          # leaving a bad file behind would make the *next* restart fail too.
          #
          # `set -e` is load-bearing: without it, one failed `cp` would leave a `.previous` from an
          # earlier deploy in place while the script still returned 0, and the trap below would
          # later restore that stale file over the current one.
          ssh "${opts[@]}" "$target" '
            set -e
            for f in server.env sync-sources.yml; do
              if [ -f /etc/skillmaster/$f ]; then
                cp -p /etc/skillmaster/$f /etc/skillmaster/$f.previous
              fi
            done'

          # Any failure after the configuration is replaced puts the previous files back. The
          # running process keeps the environment it started with, but without this a later
          # restart of the same release would read a configuration this deploy never proved.
          # The trap is installed only after the backup succeeded: a failed backup has not
          # changed anything, so there is nothing to restore.
          deploy_ok=0
          restore_configs() {
            # Both files are attempted even if one fails: restoring half a configuration is
            # worse than knowing which half did not come back.
            if ! ssh "${opts[@]}" "$target" '
              failed=0
              for f in server.env sync-sources.yml; do
                if [ -f /etc/skillmaster/$f.previous ]; then
                  cp -p /etc/skillmaster/$f.previous /etc/skillmaster/$f \
                    || { echo "restoring $f failed" >&2; failed=1; }
                else
                  # This deploy created the file where none existed; removing it is the restore.
                  rm -f /etc/skillmaster/$f \
                    || { echo "removing $f failed" >&2; failed=1; }
                fi
              done
              exit $failed'; then
              echo "::warning::restoring the previous configuration failed" >&2
              return 1
            fi
          }
          trap 'status=$?; trap - EXIT; if [ "$deploy_ok" != "1" ]; then restore_configs || true; fi; exit $status' EXIT

          # The rendered environment replaces the host's copy wholesale: the repository's
          # settings are the only source, so a value changed by hand does not survive.
          scp "${opts[@]}" server.env "$target:/etc/skillmaster/server.env"
          ssh "${opts[@]}" "$target" \
            'chown root:root /etc/skillmaster/server.env && chmod 600 /etc/skillmaster/server.env'

          # v50: the whitelist is part of the deployment, like server.env. It is not a secret, so
          # it is readable by the service user — the JVM, not root, reads it at startup.
          scp "${opts[@]}" deploy/sync-sources.yml \
            "$target:/etc/skillmaster/sync-sources.yml"
          ssh "${opts[@]}" "$target" \
            'chown root:root /etc/skillmaster/sync-sources.yml && chmod 0644 /etc/skillmaster/sync-sources.yml'

          # Read the two keys with grep, never by sourcing the file: server.env also holds
          # passwords and tokens that are not shell-quoted, and `.` would evaluate them.
          if ! ssh "${opts[@]}" "$target" '
            enabled=$(grep -E "^SKILLMASTER_SYNC_ENABLED=" /etc/skillmaster/server.env | tail -n1 | cut -d= -f2- | tr "[:upper:]" "[:lower:]")
            sources_file=$(grep -E "^SKILLMASTER_SYNC_SOURCES_FILE=" /etc/skillmaster/server.env | tail -n1 | cut -d= -f2-)
            if [ "$enabled" = "true" ]; then
              case "$sources_file" in
                file:*) path="${sources_file#file:}"
                        case "$path" in
                          /*) ;;
                          *) echo "sync sources file $path must be an absolute path" >&2
                             exit 1 ;;
                        esac
                        if ! runuser -u skillmaster -- test -f "$path" \
                           || ! runuser -u skillmaster -- test -r "$path"; then
                          echo "sync sources file $path is missing or not readable by the skillmaster user" >&2
                          exit 1
                        fi ;;
                classpath:*) echo "SKILLMASTER_SYNC_SOURCES_FILE must use file: in the deployment; the classpath copy ships empty" >&2
                   exit 1 ;;
                *) echo "SKILLMASTER_SYNC_SOURCES_FILE must start with file: (got $sources_file); a bare path is read as a classpath resource" >&2
                   exit 1 ;;
              esac
            fi'; then
            echo "the sync configuration did not validate; restoring the previous files" >&2
            exit 1
          fi

          if [ "$RELEASE" = "new" ]; then
            release="$SHA"
            ssh "${opts[@]}" "$target" "mkdir -p /opt/skillmaster/releases/$release"
            # **Three bounded attempts at the one file that is big enough to matter.** A retry
            # cannot corrupt anything: each attempt writes the whole jar to the same path, and
            # the switch below happens only after one of them returns.
            for attempt in 1 2 3; do
              if timeout 300 scp "${opts[@]}" skillmaster-server/target/skillmaster-server-*.jar \
                   "$target:/opt/skillmaster/releases/$release/app.jar"; then
                break
              fi
              echo "upload attempt $attempt of 3 did not finish; retrying" >&2
              if [ "$attempt" = 3 ]; then
                exit 1
              fi
              sleep 10
            done
            ssh "${opts[@]}" "$target" \
              "chown -R skillmaster:skillmaster /opt/skillmaster/releases/$release"
          else
            release="$RELEASE"
            # A named release is a rollback: the jar is already on the host.
            ssh "${opts[@]}" "$target" "test -f /opt/skillmaster/releases/$release/app.jar" || {
              echo "release $release is not on the host" >&2
              exit 1
            }
          fi

          # What is in service now, kept so a failed deploy has somewhere to go back to. The
          # check for existence matters: `readlink -f` prints a canonical path even when the
          # link is missing, so a first deploy would otherwise "roll back" to a symlink pointing
          # at itself.
          previous="$(ssh "${opts[@]}" "$target" \
            'if [ -e /opt/skillmaster/current ]; then readlink -f /opt/skillmaster/current; fi')"

          # **Say what this deploy is about to do, before it does it.** The run page is where a
          # rollback is discovered after the fact; the summary puts the target and what is in
          # service now side by side while it is still true.
          {
            echo "### Server deploy"
            echo ""
            if [ "$RELEASE" = "new" ]; then
              echo "- deploying: \`$release\` (this ref's Build)"
            else
              echo "- deploying a named release: \`$release\` — **this is a rollback**"
            fi
            if [ -n "$previous" ]; then
              echo "- serving now: \`$(basename "$previous")\`"
            else
              echo "- serving now: nothing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # **The switch and the health probe are one transaction.** The switch is one rename of
          # a symlink, so a running server is never left pointing at half a directory. A
          # `systemctl restart` that returns non-zero is as much a failed deploy as a process
          # that never answers; if it aborted the remote script under `set -e`, the rollback
          # below would never run and the symlink would already point at the new release. So its
          # status is reported but not fatal, and the probe decides.
          #
          # The deploy is not done until the service answers - a process that started is
          # not the same thing. Retried rather than slept through: startup opens the pool
          # and applies migrations first, and that takes as long as the database takes.
          #
          # **A failed probe rolls back.** Configuration that starts the server but leaves
          # it unable to serve is discovered right here, and the alternative - leaving the
          # new release in service and asking a person to notice - is how a deploy that
          # reports failure still takes production down.
          if ! ssh "${opts[@]}" "$target" '
                set -e
                ln -sfn /opt/skillmaster/releases/'"$release"' /opt/skillmaster/current.new
                mv -T /opt/skillmaster/current.new /opt/skillmaster/current
                old_pid=$(systemctl show -p MainPID --value skillmaster 2>/dev/null || true)
                systemctl restart skillmaster \
                  || echo "systemctl restart returned non-zero; probing anyway" >&2
                # **The first attempts are the restart, and they are expected to fail.** Between
                # `systemctl restart` and the moment Tomcat binds the port there is nothing to
                # connect to, so curl exits 7 — measured at five attempts, ~10-14s, on every
                # deploy including the ones that succeeded (2026-10-30 and 2026-11-01). `-S` used
                # to print each of them as an error line; the wait says what it is instead.
                for attempt in $(seq 1 30); do
                  # Two questions, both required. The discovery document proves the HTTP
                  # stack is up and the issuer matches the configuration, but it is built
                  # from static settings and never touches the database. /actuator/health
                  # aggregates the db indicator, so a release that starts and cannot
                  # reach RDS fails here instead of failing for the first user.
                  if curl -fs --max-time 2 http://127.0.0.1:8080/.well-known/oauth-authorization-server >/dev/null \
                     && curl -fs --max-time 2 http://127.0.0.1:8080/actuator/health >/dev/null; then
                    # A restart that failed to stop the old process can leave it answering on
                    # 8080; the probe would then praise a release that never started. Require the
                    # main process to have changed when there was one before.
                    new_pid=$(systemctl show -p MainPID --value skillmaster 2>/dev/null || true)
                    if [ -n "$old_pid" ] && [ "$old_pid" != "0" ] && [ "$new_pid" = "$old_pid" ]; then
                      echo "the service answers but still runs as PID $old_pid: the restart did not take effect" >&2
                      exit 1
                    fi
                    # **The answer must come from this release.** Before the concurrency group
                    # (2026-11-11) two deploys could overlap: the first switches, the second
                    # switches, and the first probe is answered by the second process. The
                    # symlink is what systemd starts from, so if it no longer points at this
                    # release, this deploy did not win. `readlink` (the raw target) rather than
                    # `readlink -f` (the resolved path): a relocated `/opt/skillmaster` would
                    # otherwise fail this comparison on every deploy.
                    serving=$(readlink /opt/skillmaster/current)
                    if [ "$serving" != "/opt/skillmaster/releases/'"$release"'" ]; then
                      echo "the service answers but /opt/skillmaster/current points at $serving, not /opt/skillmaster/releases/$release" >&2
                      exit 1
                    fi
                    exit 0
                  fi
                  echo "waiting for the service to bind 8080 (attempt $attempt of 30)" >&2
                  sleep 2
                done
                systemctl status skillmaster --no-pager | tail -20 >&2
                # **The unit log itself, not just its status.** A migration that throws prints its
                # cause above the twenty lines `status` keeps, and that is exactly the release this
                # probe exists to catch: the first one was diagnosed from a stack trace whose head
                # had already scrolled away. The first refusal or error line is what names it.
                journalctl -u skillmaster --no-pager -n 200 >&2 || true
                exit 1'; then
            if [ -n "$previous" ]; then
              echo "the new release did not answer; returning to $previous" >&2
              # **The rollback runs before any report is written.** A failed append to the step
              # summary under `set -e` would otherwise skip the one action this branch exists
              # for; `|| true` keeps a reporting problem from becoming a production outage.
              restore_configs \
                || echo "::warning::continuing the release rollback without the previous configuration" >&2
              if ssh "${opts[@]}" "$target" \
                "set -e
                 ln -sfn $previous /opt/skillmaster/current.new
                 mv -T /opt/skillmaster/current.new /opt/skillmaster/current
                 systemctl restart skillmaster"; then
                echo "- **probe failed; returned to \`$(basename "$previous")\`**" >> "$GITHUB_STEP_SUMMARY" || true
              else
                echo "::error::returning to $previous failed; production may be down" >&2
                echo "- **probe failed; the rollback to \`$(basename "$previous")\` also failed — check production**" >> "$GITHUB_STEP_SUMMARY" || true
              fi
            else
              echo "the new release did not answer, and there is no earlier release to return to" >&2
              echo "- **probe failed; no earlier release to return to**" >> "$GITHUB_STEP_SUMMARY" || true
            fi
            exit 1
          fi

          # The new release answered: from here a failure is cleanup, not a reason to put the
          # previous configuration back under a release that is already serving.
          deploy_ok=1

          # A successful deploy does not need the backups any more, and keeping them would leave
          # the previous database password and tokens on the host after every release. They are
          # recreated from the files in service by the next deploy, before it changes anything.
          ssh "${opts[@]}" "$target" \
            'rm -f /etc/skillmaster/server.env.previous /etc/skillmaster/sync-sources.yml.previous' \
            || echo "::warning::could not remove the previous configuration backups" >&2

          # Only a deploy that answered earns the right to prune: deleting an older
          # release before the new one has proven itself removes the way back.
          ssh "${opts[@]}" "$target" \
            'ls -1dt /opt/skillmaster/releases/*/ | tail -n +6 | xargs -r rm -rf'
          echo "deployed $release"
