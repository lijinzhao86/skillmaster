# A merge builds the image; a deployment is a separate, deliberate run.
#
# That split is the whole point of this file. A merge to main is a decision about code,
# and putting a commit in front of every user is a different decision - so the image is
# published automatically and reaches production only when somebody runs this workflow
# with a tag. The input defaults to `latest`; naming a commit sha pins the deployment to
# a build that cannot move under it.
#
# **Where the values live.** Credentials are repository *secrets*; everything else the
# deployment needs is a repository *variable*. The deploy job renders both into
# /etc/skillmaster/server.env, so production configuration has one source (this
# repository's settings) instead of a file edited by hand on the host. Local development
# keeps its own `.env`, which never leaves the machine - see the root `.env.example`.
name: Server

on:
  push:
    branches: [ main ]
    paths: &paths
      - 'skillmaster-server/**'
      # The archived Python baseline is a design reference, not built code - editing it
      # must not trigger a Java build. (`reference-python/README.md` promises this.)
      - '!skillmaster-server/reference-python/**'
      # The image carries the gateway skill: the jar's classpath comes from gateway/ via
      # pom.xml, so a change there is a change to the server.
      - 'gateway/**'
      # .dockerignore decides what the build below can see.
      - '.dockerignore'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [ main ]
    paths: *paths
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (a commit sha, or latest)'
        required: true
        default: 'latest'

permissions:
  contents: read

jobs:
  test:
    name: Test
    # A deployment run does not test: it deploys an image that was already built and, by
    # being pushable, already passed.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillmaster-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ./mvnw downloads its own Maven, so the runner needs a JDK and nothing else.
      - name: Test
        run: ./mvnw -B verify

  build:
    name: Build and push
    # Only a push to main publishes an image. A pull request runs the tests alone: an
    # in-repo PR would otherwise push an image for an unmerged commit, and a forked PR
    # has no credentials to push with in any case.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ALIYUN_REGISTRY }}
          username: ${{ vars.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The build context is the repository root because the image also carries
      # gateway/ - the content the API serves. .dockerignore trims the rest.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: skillmaster-server/Dockerfile
          push: true
          tags: |
            ${{ vars.ALIYUN_REGISTRY }}/${{ vars.ALIYUN_NAMESPACE }}/skillmaster:${{ github.sha }}
            ${{ vars.ALIYUN_REGISTRY }}/${{ vars.ALIYUN_NAMESPACE }}/skillmaster:latest
          cache-from: type=gha,scope=main-skillmaster
          cache-to: type=gha,scope=main-skillmaster,mode=max

  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Render the environment
        env:
          DB_URL: ${{ vars.SKILLMASTER_DB_URL }}
          DB_USER: ${{ vars.SKILLMASTER_DB_USER }}
          DB_PASSWORD: ${{ secrets.SKILLMASTER_DB_PASSWORD }}
          PUBLIC_BASE_URL: ${{ vars.SKILLMASTER_PUBLIC_BASE_URL }}
          COOKIE_DOMAIN: ${{ vars.SKILLMASTER_COOKIE_DOMAIN }}
          SITE_ORIGIN: ${{ vars.SKILLMASTER_SITE_ORIGIN }}
          PHONE_HMAC_KEY: ${{ secrets.SKILLMASTER_PHONE_HMAC_KEY }}
          PHONE_ENC_KEY: ${{ secrets.SKILLMASTER_PHONE_ENC_KEY }}
          SMS_KEY_ID: ${{ secrets.SKILLMASTER_SMS_ACCESS_KEY_ID }}
          SMS_KEY_SECRET: ${{ secrets.SKILLMASTER_SMS_ACCESS_KEY_SECRET }}
          SMS_SIGN_NAME: ${{ vars.SKILLMASTER_SMS_SIGN_NAME }}
          SMS_TEMPLATE_CODE: ${{ vars.SKILLMASTER_SMS_TEMPLATE_CODE }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/server.env"

          # A missing value would otherwise reach the host as an empty variable and
          # surface as a server that starts and then cannot connect. Fail here instead,
          # by name, before anything is touched.
          missing=""
          for name in DB_URL DB_USER DB_PASSWORD PUBLIC_BASE_URL COOKIE_DOMAIN SITE_ORIGIN \
                      PHONE_HMAC_KEY PHONE_ENC_KEY SMS_KEY_ID SMS_KEY_SECRET SMS_SIGN_NAME SMS_TEMPLATE_CODE; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "these repository variables/secrets are not set:$missing" >&2
            exit 1
          fi

          printf '%s\n' \
            "SKILLMASTER_DB_URL=$DB_URL" \
            "SKILLMASTER_DB_USER=$DB_USER" \
            "SKILLMASTER_DB_PASSWORD=$DB_PASSWORD" \
            "SKILLMASTER_PUBLIC_BASE_URL=$PUBLIC_BASE_URL" \
            "SKILLMASTER_COOKIE_DOMAIN=$COOKIE_DOMAIN" \
            "SKILLMASTER_SITE_ORIGIN=$SITE_ORIGIN" \
            "SKILLMASTER_PHONE_HMAC_KEY=$PHONE_HMAC_KEY" \
            "SKILLMASTER_PHONE_ENC_KEY=$PHONE_ENC_KEY" \
            "SKILLMASTER_SMS_ACCESS_KEY_ID=$SMS_KEY_ID" \
            "SKILLMASTER_SMS_ACCESS_KEY_SECRET=$SMS_KEY_SECRET" \
            "SKILLMASTER_SMS_SIGN_NAME=$SMS_SIGN_NAME" \
            "SKILLMASTER_SMS_TEMPLATE_CODE=$SMS_TEMPLATE_CODE" \
            "SKILLMASTER_SMS_LOG_CODES=false" \
            > "$out"
          chmod 600 "$out"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          ACR_USER: ${{ vars.ALIYUN_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
          REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"

          target="$DEPLOY_USER@$DEPLOY_HOST"
          opts=(-i "$key" -o StrictHostKeyChecking=accept-new)

          # The password goes over stdin, never through a command line: an argument would
          # be visible in the remote process list and in this runner's log.
          ssh "${opts[@]}" "$target" \
            "docker login $REGISTRY -u '$ACR_USER' --password-stdin" <<< "$ACR_PASSWORD"

          # The rendered environment replaces the host's copy wholesale. That is the
          # point: the repository's settings are the only source, so a value changed by
          # hand on the box does not quietly survive the next deployment.
          scp "${opts[@]}" "$RUNNER_TEMP/server.env" "$target:/etc/skillmaster/server.env"
          ssh "${opts[@]}" "$target" \
            'chown root:root /etc/skillmaster/server.env && chmod 600 /etc/skillmaster/server.env'

          # The image tag is the only thing that changes between deployments; writing it
          # here is what makes a rollback the same run with an older tag.
          ssh "${opts[@]}" "$target" \
            "set -e
             sed -i 's|^SKILLMASTER_IMAGE=.*|SKILLMASTER_IMAGE=$REGISTRY/$NAMESPACE/skillmaster:$TAG|' /etc/skillmaster/compose.env
             cd /opt/skillmaster
             docker compose --env-file /etc/skillmaster/compose.env pull
             docker compose --env-file /etc/skillmaster/compose.env up -d"
