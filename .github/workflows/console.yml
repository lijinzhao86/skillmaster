# The console lives entirely under skillmaster-console/. The workflow starts on every
# pull request and every push so its required check always reports; the `changes` job
# decides whether the console actually moved (`.github/scripts/changed-paths.sh`).
#
# It needs no database and no server: the tests stub `fetch` and assert the
# protocol, so this workflow has nothing to wait for. That is deliberate — it can
# run while the server workflow is still stopped.
name: Console

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Merging checks the console; putting it in front of users is a separate run, the same
  # arrangement as the server's.
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit sha to deploy; leave empty for this ref''s tip'
        required: false

permissions:
  contents: read
  # `changes` asks the pull request / compare API which files moved; `deploy` asks the
  # Actions API for the check that passed for this commit.
  pull-requests: read
  actions: read

defaults:
  run:
    working-directory: skillmaster-console

jobs:
  changes:
    name: Console changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The top-level `defaults` points at skillmaster-console/; the script is at the root.
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      pull-requests: read
    outputs:
      console: ${{ steps.which.outputs.console }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Which module moved
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)')"
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            # A branch's first push has no commit to compare against; every module counts
            # as touched.
            files=""
          else
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$HEAD_SHA" \
              --jq '.files[] | .filename, (.previous_filename // empty)')"
          fi
          if [ -z "$files" ]; then
            # An empty answer is not "nothing changed" — a push and a pull request both
            # always touch something. Treat it as unknown and run the checks.
            result="console=true"
          else
            result="$(printf '%s\n' "$files" | bash "$GITHUB_WORKSPACE/.github/scripts/changed-paths.sh" console)"
          fi
          echo "$result"
          echo "$result" >> "$GITHUB_OUTPUT"

  check:
    name: Console check
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # The version comes from .nvmrc rather than from here, so the runner and a
          # developer's machine read the same file.
          node-version-file: skillmaster-console/.nvmrc
          cache: npm
          cache-dependency-path: skillmaster-console/package-lock.json

      # `npm ci`, not `npm install`: it installs exactly the lockfile and fails when
      # the lockfile and package.json have drifted apart, which is the thing a CI
      # install is for.
      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # **The deploy downloads this instead of rebuilding.** Production then serves the
      # bytes this job checked, from the commit's own run.
      - name: Upload the build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: skillmaster-console/dist
          if-no-files-found: error
          overwrite: true

  deploy:
    name: Deploy
    # Merging proves the console builds; this puts it in front of users, and only when
    # somebody asks. Same split as the server, for the same reason.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillmaster-console
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # **The deploy does not build.** It requires that `Console check` passed for this
      # exact commit and downloads the artifact that job uploaded. `sha` names an older
      # commit whose check is green, for re-deploying without a new change.
      - name: Require the check this commit passed
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit sha" >&2
            exit 1
          fi
          run_id=""
          while read -r candidate; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/jobs" \
              --jq '.jobs[] | select(.name == "Console check") | .conclusion')"
            if [ "$conclusion" = "success" ]; then
              run_id="$candidate"
              break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/console.yml/runs?head_sha=$SHA&event=push&status=success&per_page=20" --jq '.workflow_runs[].id')
          if [ -z "$run_id" ]; then
            echo "::error::no successful Console check for $SHA; the commit must have been built by this workflow (a commit from before artifact deploys has no usable build)"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Download the build that check produced
        uses: actions/download-artifact@v4
        with:
          name: console-dist
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: skillmaster-console/dist

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          # Same keepalive as the server's deploy: rsync moves the built assets through this
          # ssh, and a silent, half-dead link must fail rather than hang.
          opts=(-i "$key" -o StrictHostKeyChecking=accept-new
                -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          root=/srv/skillmaster/console

          # What nginx serves now, kept so a build that turns out broken has somewhere to
          # go back to. Each deploy lands in its own directory; only the symlink moves.
          previous="$(ssh "${opts[@]}" "$target" "readlink -f $root")"

          ssh "${opts[@]}" "$target" "mkdir -p ${root}-releases/$SHA"
          rsync -az --delete --timeout=120 -e "ssh ${opts[*]}" dist/ "$target:${root}-releases/$SHA/"
          ssh "${opts[@]}" "$target" \
            "set -e
             ln -sfn ${root}-releases/$SHA ${root}.new
             mv -T ${root}.new $root"

          # A deploy is not done until the page answers. The probe runs **on the host**,
          # through the real name and the real certificate, with DNS swapped for loopback:
          # that covers nginx, the certificate and the files, and it does not depend on
          # the runner's egress.
          #
          # **Why not from the runner** (2026-10-25): every TLS attempt from a GitHub
          # runner to this host was reset between the ClientHello and the ServerHello
          # (curl 35, all eleven retries; SSH and rsync to the same host worked, and the
          # same names answer fine from other networks). A public probe therefore failed
          # for a reason this repository cannot fix, and rolled back a build that was
          # fine. Public reachability is not something a console deploy can break - the
          # names, the proxy and the certificate are the same before and after - so the
          # probe asks the question this job can answer.
          if ! ssh "${opts[@]}" "$target" \
               'curl -fsS --retry 10 --retry-delay 2 --retry-all-errors --max-time 5 \
                  --resolve console.skillmasterai.com:443:127.0.0.1 -o /dev/null \
                  https://console.skillmasterai.com/'; then
            echo "the new build did not answer; returning to $previous" >&2
            ssh "${opts[@]}" "$target" \
              "set -e
               ln -sfn $previous ${root}.new
               mv -T ${root}.new $root"
            exit 1
          fi

          ssh "${opts[@]}" "$target" "ls -1dt ${root}-releases/*/ | tail -n +6 | xargs -r rm -rf"
          echo "deployed $SHA"
