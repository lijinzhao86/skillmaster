# The console lives entirely under skillmaster-console/, so only changes there run
# this.
#
# It needs no database and no server: the tests stub `fetch` and assert the
# protocol, so this workflow has nothing to wait for. That is deliberate — it can
# run while the server workflow is still stopped.
name: Console

on:
  push:
    branches: [ main ]
    paths: &paths
      - 'skillmaster-console/**'
      - '.github/workflows/console.yml'
  pull_request:
    branches: [ main ]
    paths: *paths
  # Merging checks the console; putting it in front of users is a separate run, the same
  # arrangement as the server's.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: skillmaster-console

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # The version comes from .nvmrc rather than from here, so the runner and a
          # developer's machine read the same file.
          node-version-file: skillmaster-console/.nvmrc
          cache: npm
          cache-dependency-path: skillmaster-console/package-lock.json

      # `npm ci`, not `npm install`: it installs exactly the lockfile and fails when
      # the lockfile and package.json have drifted apart, which is the thing a CI
      # install is for.
      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    # Merging proves the console builds; this puts it in front of users, and only when
    # somebody asks. Same split as the server, for the same reason.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillmaster-console
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: skillmaster-console/.nvmrc
          cache: npm
          cache-dependency-path: skillmaster-console/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          # Same keepalive as the server's deploy: rsync moves the built assets through this
          # ssh, and a silent, half-dead link must fail rather than hang.
          opts=(-i "$key" -o StrictHostKeyChecking=accept-new
                -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          root=/srv/skillmaster/console

          # What nginx serves now, kept so a build that turns out broken has somewhere to
          # go back to. Each deploy lands in its own directory; only the symlink moves.
          previous="$(ssh "${opts[@]}" "$target" "readlink -f $root")"

          ssh "${opts[@]}" "$target" "mkdir -p ${root}-releases/$SHA"
          rsync -az --delete --timeout=120 -e "ssh ${opts[*]}" dist/ "$target:${root}-releases/$SHA/"
          ssh "${opts[@]}" "$target" \
            "set -e
             ln -sfn ${root}-releases/$SHA ${root}.new
             mv -T ${root}.new $root"

          # A deploy is not done until the page answers. The probe runs **on the host**,
          # through the real name and the real certificate, with DNS swapped for loopback:
          # that covers nginx, the certificate and the files, and it does not depend on
          # the runner's egress.
          #
          # **Why not from the runner** (2026-10-25): every TLS attempt from a GitHub
          # runner to this host was reset between the ClientHello and the ServerHello
          # (curl 35, all eleven retries; SSH and rsync to the same host worked, and the
          # same names answer fine from other networks). A public probe therefore failed
          # for a reason this repository cannot fix, and rolled back a build that was
          # fine. Public reachability is not something a console deploy can break - the
          # names, the proxy and the certificate are the same before and after - so the
          # probe asks the question this job can answer.
          if ! ssh "${opts[@]}" "$target" \
               'curl -fsS --retry 10 --retry-delay 2 --retry-all-errors --max-time 5 \
                  --resolve console.skillmasterai.com:443:127.0.0.1 -o /dev/null \
                  https://console.skillmasterai.com/'; then
            echo "the new build did not answer; returning to $previous" >&2
            ssh "${opts[@]}" "$target" \
              "set -e
               ln -sfn $previous ${root}.new
               mv -T ${root}.new $root"
            exit 1
          fi

          ssh "${opts[@]}" "$target" "ls -1dt ${root}-releases/*/ | tail -n +6 | xargs -r rm -rf"
          echo "deployed $SHA"
