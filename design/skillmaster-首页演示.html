u52A9\u3002\u670D\u52A1\u53EF\u80FD\u968F\u4EA7\u54C1\u6F14\u8FDB\u800C\u8C03\u6574\uFF1B\u5BF9\u4F60\u9020\u6210\u91CD\u5927\u5F71\u54CD\u7684\u53D8\u66F4\uFF0C\u6211\u4EEC\u4F1A\u63D0\u524D\u5728\u7AD9\u5185\u8BF4\u660E\u3002","\u5F53\u524D\u516C\u5F00\u5E02\u573A\u53EA\u5411\u5E73\u53F0\u5B98\u65B9\u547D\u540D\u7A7A\u95F4\u5F00\u653E\u3002\u666E\u901A\u7528\u6237\u53EF\u4EE5\u5C06 skill \u5206\u4EAB\u7ED9\u7279\u5B9A\u7528\u6237\uFF0C\u6216\u8BA9\u4ED6\u4EBA\u6536\u8FDB\u81EA\u5DF1\u7684\u5E93\uFF1B\u88AB\u5206\u4EAB\u8005\u662F\u5426\u7EE7\u7EED\u53EF\u7528\uFF0C\u53D6\u51B3\u4E8E\u4F60\u7684\u5206\u4EAB\u662F\u5426\u4ECD\u7136\u6709\u6548\u3002"]},{heading:"\u4E94\u3001\u4F60\u53D1\u5E03\u7684\u5185\u5BB9",paragraphs:["\u4F60\u5BF9\u81EA\u5DF1\u4E0A\u4F20\u3001\u63D0\u4EA4\u6216\u5206\u4EAB\u7684 skill \u4E0E\u5185\u5BB9\u8D1F\u8D23\uFF0C\u5E76\u4FDD\u8BC1\u62E5\u6709\u76F8\u5E94\u7684\u77E5\u8BC6\u4EA7\u6743\u6216\u5DF2\u53D6\u5F97\u5145\u5206\u6388\u6743\u3002\u4F60\u7684\u5185\u5BB9\u4E0D\u4FB5\u72AF\u4ED6\u4EBA\u7684\u8457\u4F5C\u6743\u3001\u5546\u6807\u6743\u3001\u4E13\u5229\u6743\u3001\u5546\u4E1A\u79D8\u5BC6\u3001\u4E2A\u4EBA\u4FE1\u606F\u3001\u8096\u50CF\u6743\u3001\u540D\u8A89\u6743\u6216\u5176\u4ED6\u5408\u6CD5\u6743\u76CA\u3002","\u4F60\u6307\u793A\u4F60\u7684 agent \u63D0\u4EA4\u7684\u5185\u5BB9\uFF0C\u89C6\u4E3A\u4F60\u63D0\u4EA4\uFF1B\u4F60\u5BF9\u81EA\u5DF1\u8BA9 agent \u505A\u7684\u4E8B\u8D1F\u8D23\u3002","\u4F60\u4FDD\u7559\u4F60\u5185\u5BB9\u7684\u77E5\u8BC6\u4EA7\u6743\u3002\u4E3A\u5411\u4F60\u63D0\u4F9B\u670D\u52A1\uFF0C\u4F60\u6388\u4E88\u6211\u4EEC\u4E00\u9879\u975E\u72EC\u5360\u3001\u4E0D\u53EF\u8F6C\u8BA9\u3001\u53EF\u8F6C\u6388\u6743\u7684\u8BB8\u53EF\uFF0C\u7528\u4E8E\u5B58\u50A8\u3001\u5C55\u793A\u3001\u5206\u53D1\u3001\u5907\u4EFD\u4E0E\u5FC5\u8981\u7684\u6280\u672F\u5904\u7406\uFF1B\u8BE5\u8BB8\u53EF\u5728\u4F60\u5220\u9664\u5185\u5BB9\u6216\u6CE8\u9500\u8D26\u53F7\u540E\uFF0C\u6309\u300A\u9690\u79C1\u653F\u7B56\u300B\u7684\u4FDD\u7
