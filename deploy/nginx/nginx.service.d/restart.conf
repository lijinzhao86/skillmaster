# nginx starts again after a transient failure (2026-11-05).
#
# Ubuntu's nginx unit ships with `Restart=no`. On 2026-11-05 the service failed to start
# once — apt's needrestart was restarting it while systemd-resolved was still coming back,
# and the old configuration resolved the OSS download host at load time — and it stayed
# down for 2h47m because nothing tried again.
#
# `on-failure` rather than `always`: a clean stop (an operator's `systemctl stop`) must stay
# stopped. Five seconds is long enough for a DNS blip to pass; systemd's default start limit
# still gives up on a configuration that is genuinely broken instead of looping forever.
[Service]
Restart=on-failure
RestartSec=5
