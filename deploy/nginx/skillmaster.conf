# Four names, one machine.
#
#   console.skillmasterai.com   the console SPA, plus every path the server answers
#   www.skillmasterai.com       the marketing page, static files only
#   skillmasterai.com           a redirect to www
#   dl.skillmasterai.com        the CLI download site, a proxy in front of an OSS bucket
#
# The shape is decided elsewhere and is not ours to re-invent here:
#
#   ADR 0015  the console and the API share an origin in production, so the session
#             cookie and the double-submit CSRF cookie stay same-origin. That is why
#             /web/ and /api/v1/ are proxied from the console's own name rather than
#             given a name of their own.
#   ADR 0018  the forwarding headers are OVERWRITTEN, not appended. With
#             $proxy_add_x_forwarded_for the caller's own value stays leftmost, Spring
#             reads the leftmost value, and the three per-address rate limits become
#             something a caller picks. Forwarded is cleared for the same reason: the
#             RFC 7239 header is parsed in preference to X-Forwarded-For.
#   ADR 0086  www reads the session with one cross-origin GET. The CORS answer comes
#             from the server (SKILLMASTER_SITE_ORIGIN), never from here - a proxy that
#             added CORS headers would be a second place deciding the same thing.
#
# Routes the server answers, and the only ones proxied. The list is its routing table
# (WebRoutes, SkillRoutes, TokenSecurityConfig, SecurityConfig), not a guess.
#
#   /web/**          the browser API, session + CSRF
#   /api/v1/**       the API plane, bearer token
#   /oauth/**        the authorization server (third parties)
#   /.well-known/**  discovery, JWKS
#
#   /gateway/**      **kept although nothing answers it** (ADR 0096). The startup journey used
#                    to live there; now the request must reach the server so a late client gets
#                    its 404 instead of this proxy's SPA fallback, which would answer 200 with a
#                    page. The prefix is what makes that distinction possible.

upstream skillmaster_server {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Port 80 exists only to say "use https".
#
# **On this host it is inert.** Aliyun's ICP check answers every external port-80 request before it
# reaches nginx, so neither this redirect nor the ACME location below ever runs; both certificates
# renew over DNS instead (deploy/README.md §Certificates). The block stays because that interception
# is not ours to depend on, and because an ordinary browser still types the bare name.
server {
    listen 80;
    listen [::]:80;
    server_name console.skillmasterai.com www.skillmasterai.com skillmasterai.com dl.skillmasterai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.skillmasterai.com;

    ssl_certificate     /etc/skillmaster/tls/fullchain.pem;
    ssl_certificate_key /etc/skillmaster/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /srv/skillmaster/console;
    index index.html;

    # The server refuses a body over 32 MB (application.yml, multipart). The proxy sits
    # slightly above it so an over-limit upload is refused by the server, which answers
    # with a code the CLI knows, instead of by nginx, which answers with an HTML page.
    client_max_body_size 40m;

    # A regex location wins over the prefix one below, so these prefixes are the whole API
    # surface and every other path belongs to the SPA.
    #
    # **`cli-sign-ins` is one of them and is not under `/web`.** It is the one route the CLI
    # calls without a session — the exchange that turns its one-time code into a credential —
    # and it sits outside every other prefix, so leaving it out sent that POST to
    # `try_files`, which answers 405 with an nginx HTML page. The CLI reads that as a server
    # that refuses to exchange, not as a proxy that never forwarded it (2026-10-26).
    # `cli-sign-in` (singular) is the SPA's page and deliberately stays out: the boundary
    # below is what keeps the two apart.
    location ~ ^/(web|api/v1|oauth|\.well-known|gateway|cli-sign-ins)(/|$) {
        proxy_pass http://skillmaster_server;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded         "";
        proxy_set_header Connection        "";

        # The server streams a downloaded skill as a zip it builds on the way out.
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }

    # The console is a single-page app: /login, /register, /reset, /skills/<id> and the
    # rest are its own routes and must reach index.html. ADR 0015 warns that a rewrite
    # for /web must never swallow these - they do not collide, and this is why.
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        # Vite fingerprints the file names, so the content under one is immutable.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.skillmasterai.com;

    ssl_certificate     /etc/skillmaster/tls/fullchain.pem;
    ssl_certificate_key /etc/skillmaster/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /srv/skillmaster/site;
    index index.html;

    # One page (v15). The fallback is here so a future route added to the SPA does not
    # start answering 404 on a reload.
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skillmasterai.com;

    ssl_certificate     /etc/skillmaster/tls/fullchain.pem;
    ssl_certificate_key /etc/skillmaster/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://www.skillmasterai.com$request_uri;
}

# dl.skillmasterai.com — where the CLI is downloaded (skillmaster-cli/RELEASE.md §6).
#
# **The files are in an OSS bucket, but this name does not resolve to it.** OSS would not
# take the custom domain: `PutCname` answers `NoSuchCnameInRecord` while the CNAME record,
# the `_dnsauth` TXT record and the token OSS itself handed back all agree (2026-10-26).
# A proxy is a smaller thing to own than a binding we cannot make, and it is one line to
# replace the day the binding works.
#
# What the bucket owns stays the bucket's: each object's Content-Type and the
# `Cache-Control: no-cache` the release uploads with it are passed through as stored, not
# decided again here. The release job re-downloads all six packages from this name and
# compares them against `checksums.txt`, so what it verifies is what a user gets.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dl.skillmasterai.com;

    ssl_certificate     /etc/skillmaster/tls-dl/fullchain.pem;
    ssl_certificate_key /etc/skillmaster/tls-dl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The bucket's public endpoint, not its internal one: this machine is in cn-shanghai
    # and the bucket in cn-hangzhou, and an internal endpoint only answers inside its own
    # region. Nothing is signed on this hop — the bucket is public-read.
    location / {
        proxy_pass https://skillmaster-dl.oss-cn-hangzhou.aliyuncs.com;
        proxy_ssl_server_name on;
        # **Verified, not just encrypted.** Without this nginx accepts any certificate on the
        # Shanghai→Hangzhou hop, and the installers compare against a checksums.txt fetched from the
        # same origin — a rewritten package would arrive with a rewritten checksum. OSS's endpoint
        # chains to a public CA.
        #
        # **When it breaks, the symptom is a 502 on every path**, not a TLS warning: the reason is
        # in `error.log` as "upstream SSL certificate verify error". First check is the chain from
        # the host (`openssl s_client -connect skillmaster-dl.oss-cn-hangzhou.aliyuncs.com:443
        # -showcerts`), then `apt-get install --reinstall ca-certificates && systemctl reload nginx`.
        proxy_ssl_verify              on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth        3;
        proxy_set_header Host skillmaster-dl.oss-cn-hangzhou.aliyuncs.com;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        # A few megabytes on whatever line the installer has. Buffering the file to disk
        # first would only delay the first byte.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # A name with no index: a bare visit should say there is nothing here rather than
    # relay the bucket's refusal to list itself.
    location = / {
        default_type text/plain;
        return 404 "SkillMaster downloads: fetch a file by name, e.g. /install.sh\n";
    }
}
