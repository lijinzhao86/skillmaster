# STALE since v69: the live copy is deploy/ops/sync-sources.yml. This file is kept only
# because the v50 documents cite it; nothing reads it and the server workflow no longer ships it.
# v50 同步来源白名单（2026-11-07 首次全量导入，之后有增补）
#
# 本文件能直接得到的是仓库数与 `configured` 行数；展开后的 `entries`（select: all 的 skill 数）
# 是同步运行结果，没有总数。逐条注释里的 skill 数是扫描快照，实际以运行结果为准。
# 当前规模不抄进文档；历史运行的计数留在 v50 TD §日志与 test-plan §结果。
#
# The deploy workflow copies this file to /etc/skillmaster/sync-sources.yml
# (root:root, 0644) and the deployment points at it with
#   SKILLMASTER_SYNC_SOURCES_FILE=file:/etc/skillmaster/sync-sources.yml
# — the `file:` prefix is required; a bare path is read as a classpath resource.
#
# The repository is the source: edit here and deploy. A change made on the host does not survive
# the next deployment, the same rule server.env follows.
#
# A malformed file (bad YAML, unknown key, unknown kind, an escaping path) is a startup failure
# when sync is enabled: the whitelist is read at boot rather than on the first run. A `license:`
# path that is syntactically fine but absent from the synced commit is different — that entry is
# blocked at run time (`license_path_missing`) and the server keeps serving.
#
# 命名表来自 2026-11-07 的一次扫描，口径：GitHub 检索 topic:claude-skills /
# topic:agent-skills / topic:claude-code-skills 与名称、描述含 claude skills / agent skills 的仓库，
# 按 star 排序；对每个候选下载 codeload 整包，核对 SKILL.md 与 frontmatter 的 name。共核 37 个
# 仓库、12,839 个 SKILL.md（4,846 个不同名字），其中 730 个名字出现在不止一个仓库。
# 地址在第一次成功导入时分配，之后按 (kind, locator, path) 固定：之后再加 prefix 也不会改已分配的
# 地址（ADR 0160）。
